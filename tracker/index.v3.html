/* ---------- reference catalog: seed feeds + learned (AI fills) + owned ---------- */
let CATALOG=null;      // merged {ink,pen,paper} arrays; invalidated after every save
let SEED=null;          // ink_catalog.json — only cached once it actually loads
let LEARNED=null;       // catalog_learned.json — same
async function loadSeed(){
  if(SEED) return SEED;
  try{
    const r=await fetch("ink_catalog.json");
    if(r.ok){const j=await r.json();SEED={inks:j.inks||[],pens:j.pens||[],papers:j.papers||[]};}
  }catch(e){ /* leave SEED null so the next Add-sheet open retries instead of caching failure */ }
  return SEED || {inks:[],pens:[],papers:[]};
}
async function loadLearned(){
  if(LEARNED) return LEARNED;
  try{
    const r=await fetch("catalog_learned.json");
    if(r.ok){const j=await r.json();if(Array.isArray(j))LEARNED=j;}
  }catch(e){ /* retry next time, same as loadSeed */ }
  return LEARNED || [];
}
async function loadCatalog(){
  if(CATALOG) return CATALOG;
  const seed=await loadSeed();
  const learned=await loadLearned();
  const mk=()=>new Map();
  const maps={ink:mk(),pen:mk(),paper:mk()};
  const put=(kind,a,b,e)=>{if(a&&b)maps[kind].set(String(a).toLowerCase()+"|"+String(b).toLowerCase(),e);};
  seed.inks.forEach(e=>put("ink",e.brand,e.name,e));
  seed.pens.forEach(e=>put("pen",e.make,e.model,e));
  seed.papers.forEach(e=>put("paper",e.brand,e.name,e));
  // learned entries carry researched attributes — they win over seed
  learned.forEach(e=>{const k=e.kind||"ink";
    put(k, k==="pen"?e.make:e.brand, k==="pen"?e.model:e.name, e);});
  S.inks.forEach(i=>put("ink",i.brand,i.name,{brand:i.brand,name:i.name,
    color_match:i.color_match,sheen:i.sheen,shimmer:i.shimmer,shading:i.shading}));
  S.pens.forEach(p=>put("pen",p.make,p.model,{make:p.make,model:p.model,
    colors:p.material_color?[p.material_color]:[],filling:p.filling,year_or_era:p.year}));
  S.papers.forEach(p=>put("paper",p.brand,p.name,{brand:p.brand,name:p.name,
    type:p.type,size:p.size,gsm:p.gsm,ruling:p.ruling,surface:p.surface}));
  CATALOG={ink:[...maps.ink.values()],pen:[...maps.pen.values()],paper:[...maps.paper.values()]};
  return CATALOG;
}
async function setupAutocomplete(kind){
  const cat=await loadCatalog();
  const list=cat[kind]||[];
  const sheet=document.querySelector(".sheet");
  if(!sheet||!$("#seedA")||!list.length) return;
  const A=e=>kind==="pen"?e.make:e.brand, B=e=>kind==="pen"?e.model:e.name;
  const dlB=document.createElement("datalist");dlB.id="dl-brand";
  const dlN=document.createElement("datalist");dlN.id="dl-name";
  sheet.appendChild(dlB);sheet.appendChild(dlN);
  $("#seedA").setAttribute("list","dl-brand");
  $("#seedB").setAttribute("list","dl-name");
  dlB.innerHTML=[...new Set(list.map(A))].sort((a,b)=>a.localeCompare(b))
    .map(b=>`<option value="${esc(b)}">`).join("");
  const refreshNames=()=>{
    const b=$("#seedA").value.trim().toLowerCase();
    let l=b?list.filter(e=>A(e).toLowerCase()===b):[];
    if(!l.length&&b.length>=3) l=list.filter(e=>A(e).toLowerCase().startsWith(b));
    dlN.innerHTML=l.slice(0,300).map(e=>`<option value="${esc(B(e))}">`).join("");
  };
  // Only fills EMPTY fields — never overwrites something the user already typed.
  const set=(k,v)=>{const el=document.querySelector(`#addF [data-k="${k}"]`);
    if(el&&v!=null&&v!==""&&!el.value)el.value=String(v);};
  const tryMatch=()=>{
    const b=$("#seedA").value.trim().toLowerCase(), n=$("#seedB").value.trim().toLowerCase();
    if(!b||!n) return;
    const e=list.find(x=>A(x).toLowerCase()===b&&String(B(x)).toLowerCase()===n);
    if(!e) return;
    let note="Matched in catalog — fields prefilled. ✨ AI fill adds the rest.";
    if(kind==="ink"){
      set("color_match",e.color_match||e.color);
      set("sheen",e.sheen);set("shading",e.shading);
      set("alkaline",e.alkaline);
      if(e.shimmer!=null)set("shimmer",String(e.shimmer===true||e.shimmer==="true"));
    }else if(kind==="pen"){
      set("filling",e.filling);set("year",e.year_or_era);
      set("nib_material",e.nib_material);
      const colors=(e.colors||[]).filter(Boolean);
      if(colors.length===1){
        set("material_color",colors[0]);
      }else if(colors.length>1){
        // Multiple known colorways — don't force a dropdown over what the user
        // is typing; just say how many are on file.
        note=`Matched in catalog (${colors.length} known colorways — type your own or see notes). ✨ AI fill adds the rest.`;
      }
    }else{
      set("type",e.type);set("size",e.size);set("gsm",e.gsm);
      set("ruling",e.ruling);set("surface",e.surface);
    }
    $("#aiStat").textContent=note;
  };
  $("#seedA").addEventListener("input",refreshNames);
  $("#seedA").addEventListener("change",()=>{refreshNames();tryMatch();});
  $("#seedB").addEventListener("input",tryMatch);
  $("#seedB").addEventListener("change",tryMatch);
  refreshNames();
}

function setField(k,v){const el=document.querySelector(`#addF [data-k="${k}"]`);if(el&&v!=null&&v!=="")el.value=v;}
async function runAI(kind){
  const stat=$("#aiStat");const btn=$("#aiBtn");
  const a=$("#seedA").value.trim(),b=$("#seedB").value.trim();
  if(!a&&!b){stat.textContent="Enter a name first.";return;}
  btn.disabled=true;stat.innerHTML='<span class="spin"></span>Researching — usually 10–20s…';
  const payload=kind==="pen"?{kind:"pen",make:a,model:b}:{kind,brand:a,name:b};
  try{
    const r=await fetch("/api/ai-fill",{method:"POST",headers:apiHeaders(),body:JSON.stringify(payload)});
    const j=await r.json();
    if(!j.ok){stat.textContent=j.error||"AI fill failed";btn.disabled=false;return;}
    const f=j.fields||{};
    Object.entries(f).forEach(([k,v])=>{
      if(v==null)return;
      if(k==="shimmer"){const el=document.querySelector(`#addF [data-k="shimmer"]`);if(el)el.value=String(!!v);return;}
      if(k==="msrp_usd"){setField("est_value",v);return;}

      setField(k,v);
    });
    stat.textContent=`Filled (confidence: ${j.confidence||"?"}). Review & edit, then Save.`;
    renderAIImages(j.images||[], `${a} ${b}`.trim());

/* ============================ capture flow (Add a pen) ============================
   POST /api/capture-url {url} -> {ok,source,multi,items:[{title,price,nib,blurb}],
   fields:{make,model,material_color,nib_grind,nib_material,filling,paid,seller,
   source,notes},photos:[...]}. Another agent owns that endpoint; this degrades to
   the manual + AI-fill flow above on a 404, a network error, or {ok:false}. */
let CAP={};
function openCapture(){
  CAP={values:{},src:{},photos:[],items:null,multi:false,selected:0,excluded:new Set(),serverFields:{}};
  modal(captureHTML());
  const inp=document.getElementById("capUrl");
  if(inp){ inp.focus(); inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runCapture();}}); }
}
function captureHTML(){
  return `<div class="sheet wide"><div class="head"><h2>Add a pen</h2><button class="x" aria-label="Close" onclick="closeModal()">✕</button></div>
    <div class="body">
      ${kindSwitchHTML("pen")}
      <div class="subline" style="margin:-8px 0 14px">Paste where you bought it and the rest fills itself in. Correct anything that looks wrong.</div>
      <div class="cap-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" style="width:19px;height:19px;flex:none"><path d="M10 13.8a4.5 4.5 0 0 0 6.5.4l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.7 1.7"/><path d="M14 10.2a4.5 4.5 0 0 0-6.5-.4l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.7-1.7"/></svg>
        <input id="capUrl" placeholder="Paste a link — or paste the listing text itself">
        <button class="btn" id="capGo" onclick="runCapture()">Read it</button>
      </div>
      <textarea id="capText" class="cap-text hidden" rows="9"
        placeholder="Paste the whole post here — title and body. Multi-pen listings are fine; you'll pick yours next."></textarea>
      <div class="cap-reads">
        <span class="lbl2">Reads</span>
        <span class="pill">eBay listings</span>
        <span class="pill">Goulet, Vanness, FPH, Cult Pens</span>
        <span class="pill" style="color:var(--muted)">most other shop pages</span>
        <span class="pill">r/Pen_Swap (paste the text)</span>
        <span class="pill">pasted text from anywhere</span>
      </div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--muted)">
        Reddit blocks direct reads of posts from any app — there is no way around that.
        For r/Pen_Swap: open the post, select all its text, and
        <a href="#" onclick="event.preventDefault();capPasteMode()">paste it here</a> instead of the link.
      </div>
      <div style="margin-top:12px"><a href="#" onclick="event.preventDefault();openAddManual('pen')" style="font-size:12.5px">Skip — enter it by hand</a></div>
      <div id="capBody"></div>
    </div>
    <div class="foot"><button class="btn sec" onclick="closeModal()">Cancel</button></div></div>`;
}
// Reveal the paste box. Reddit's API is closed to new apps and its site
// blocks server-side reads, so pasting the post text is the only path that
// works — not a fallback, the normal route for Reddit.
window.capPasteMode=(focus=true)=>{
  const ta=$("#capText"); if(!ta) return;
  ta.classList.remove("hidden");
  if(focus) ta.focus();
};
async function runCapture(){
  const inp=document.getElementById("capUrl"), ta=document.getElementById("capText");
  const url=(inp?inp.value:"").trim();
  const pasted=(ta&&!ta.classList.contains("hidden")?ta.value:"").trim();
  // A blob of text in the link box is text, not a URL — treat it as such.
  const looksLikeUrl = /^(https?:\/\/|www\.)\S+$/i.test(url);
  const text = pasted || (url && !looksLikeUrl ? url : "");
  if(!text && !url){toast("Paste a link or the listing text");return;}
  const btn=$("#capGo"), body=$("#capBody");
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>Reading…';
  body.innerHTML="";
  try{
    const payload = text ? {text} : {url};
    const r=await fetch("/api/capture-url",{method:"POST",headers:apiHeaders(),body:JSON.stringify(payload)});
    if(r.status===404){ throw {unavailable:true}; }
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"Could not read that page");
    CAP.items=j.items||[]; CAP.multi=!!j.multi; CAP.photos=j.photos||[];
    CAP.serverFields=j.fields||{}; CAP.excluded=new Set();
    // The server points at the lot most likely to be the one you bought — when
    // exactly one pen in the post is marked SOLD, that's it. Start there.
    CAP.selected=Math.min(Math.max(0, j.suggested|0), Math.max(0, CAP.items.length-1));
    await applyCaptureFields(CAP.selected);
    renderCaptureBody();
  }catch(e){
    if(e&&e.unavailable){
      toast("Paste capture isn't set up yet — filling in by hand");
      openAddManual("pen");
    }else{
      const msg=esc(e&&e.message||"Could not read that page");
      const blocked=/bot check|cannot read the post|closed to new registrations|403/i.test(msg);
      if(blocked) capPasteMode(true);
      body.innerHTML=`<div class="muted" style="margin-top:14px">${msg}${blocked?"":` —
        try again, or <a href="#" onclick="event.preventDefault();openAddManual('pen')">enter it by hand</a>.`}</div>`;
    }
  }
  if(btn){btn.disabled=false;btn.textContent="Fetch";}
}
async function applyCaptureFields(itemIdx){
  const sf=CAP.serverFields||{}, src={}, val={};
  const set=(k,v,s)=>{ if(v!=null&&v!==""){ val[k]=v; src[k]=s; } };
  if(itemIdx===0){
    set("make",sf.make,"post"); set("model",sf.model,"post");
    set("material_color",sf.material_color,"post");
    set("nib_grind",sf.nib_grind,"post"); set("nib_material",sf.nib_material,"post");
    set("filling",sf.filling,"post"); set("seller",sf.seller,"post"); set("notes",sf.notes,"post");
    if(sf.paid!=null){ val.paid=sf.paid; src.paid="askprice"; }
    if(sf.source){ val.source=sf.source; src.source="post"; }
  }
  const it=CAP.items&&CAP.items[itemIdx];
  if(it){
    if(itemIdx>0){
      const parts=String(it.title||"").trim().split(/\s+/).filter(Boolean);
      if(parts.length){ val.make=parts[0]; src.make="post";
        if(parts.length>1){ val.model=parts.slice(1).join(" "); src.model="post"; } }
    }
    if(it.price!=null){ val.paid=it.price; src.paid="askprice"; }
    if(it.nib){ val.nib_grind=it.nib; src.nib_grind="post"; }
    if(it.blurb && !val.notes){ val.notes=it.blurb; src.notes="post"; }
  }
  try{
    const cat=await loadCatalog(); const list=cat.pen||[];
    const m=String(val.make||"").toLowerCase(), md=String(val.model||"").toLowerCase();
    const hit=m&&md&&list.find(e=>String(e.make||"").toLowerCase()===m && String(e.model||"").toLowerCase()===md);
    if(hit){

/* ============================ pairing engine ============================ */
/* Local rules encoding fountain-pen lore: shimmer→broad modern easy-clean;
   sheen→wet lines + coated paper; shading→flex/italic + smooth paper;
   vintage→well-behaved inks. No network needed. */
function nibProfile(pen){
  const g=String(pen.nib_grind||"").toLowerCase();
  const grind=/(stub|italic|\bci\b|bci|mci|uci|\bsig\b|cursive|music|architect|\bcm\b|1\.[0-9])/.test(g);
  const broad=grind||/\b(bbb|bb|b|broad|zoom)\b/.test(g);
  const fine=!broad&&/\b(uef|ef|xf|sef|f|fine)\b/.test(g);
  const medium=!broad&&!fine&&(/\bm\b|medium/.test(g));
  const flex=/flex/.test(g);
  return {grind,broad,fine,medium,flex};
}
const isVintage=pen=>/vintage/i.test(pen.make||"")
  ||/19[0-6]\d/.test(String(pen.year||""))
  ||/lever|button|sac|crescent|leverless|twist|plunger|safety|blow|aerometric|vacumatic|vac\b/i.test(String(pen.filling||""));
const isEasyClean=pen=>/cartridge|converter|c\/c|eyedropper/i.test(String(pen.filling||""));
const hasSheen=ink=>ink.sheen&&ink.sheen!=="None";
const hasShading=ink=>/moderate|strong/i.test(ink.shading||"");

function scoreInkForPen(pen,ink){
  const p=nibProfile(pen),v=isVintage(pen);
  let s=0;const why=[],warn=[];
  if(ink.shimmer){
    if(v){s-=4;warn.push("shimmer particles can lodge in vintage sacs and feeds");}
    else{
      if(p.broad){s+=3;why.push("broad/italic nib lays down enough ink for shimmer to show");}
      else if(p.fine){s-=3;warn.push("shimmer tends to clog fine nibs");}
      else {s+=1;why.push("medium line carries some sparkle");}
      if(isEasyClean(pen)){s+=1;why.push("easy-flush filler");}
    }
  }
  if(ink.alkaline==="Yes"&&v){s-=3;warn.push("alkaline ink — hard on vintage sacs, seals and celluloid");}
  if(hasSheen(ink)){
    if(p.broad){s+=2;why.push(`wet, wide line builds the ${String(ink.sheen).toLowerCase()} sheen`);}
    else if(p.fine){s-=1;why.push("thin lines rarely show sheen");}
    if(v){s-=1;warn.push("heavily saturated sheen inks can stain vintage material");}
  }
  if(hasShading(ink)){
    if(p.flex){s+=3;why.push("flex line variation shows shading beautifully");}
    else if(p.grind){s+=2;why.push("stub/italic grind emphasizes shading");}
    else if(p.medium){s+=1;why.push("medium line shades nicely");}
  }
  if(!ink.shimmer&&!hasSheen(ink)&&ink.alkaline!=="Yes"){
    if(v){s+=2;why.push("well-behaved ink — safe for a vintage filler");}
    else if(!hasShading(ink)){s+=0.5;why.push("easy everyday pairing");}
  }
  return {s,why,warn};
}
function scorePaperForInk(ink,paper){
  let s=0;const why=[],warn=[];
  const surf=String(paper.surface||"").toLowerCase();
  if(hasSheen(ink)){
    if(surf==="coated"){s+=3;why.push("coated paper makes sheen pop");
      if(paper.gsm&&paper.gsm<=68){s+=1;why.push("thin coated stock is peak sheen");}}
    if(surf==="absorbent"){s-=3;warn.push("absorbent paper drinks the ink before sheen can form");}
  }
  if(ink.shimmer&&(surf==="coated"||surf==="smooth")){s+=1;why.push("particles sit on the surface and sparkle");}
  if(hasShading(ink)){
    if(surf==="smooth"){s+=2;why.push("smooth paper lets the ink pool into shading");}
    else if(surf==="coated"){s+=1;why.push("slow absorption deepens shading");}
    else if(surf==="absorbent"){s-=1;}
  }
  if(/severe/i.test(paper.bleedthrough||"")){s-=2;warn.push("bleeds through with wet inks");}
  if(String(paper.rating)==="5"){s+=1;why.push("your top-rated paper");}
  return {s,why,warn};
}
function verdict(s){
  if(s>=3)  return {label:"Great", cls:"b-Keep"};
  if(s>=1)  return {label:"Good",  cls:"b-Undecided"};
  if(s<=-2) return {label:"Avoid", cls:"b-WillSell"};
  return {label:"OK", cls:"b-Sold"};
}
function pairRows(items,scoreFn,labelFn,openFn){
  const scored=items.map(x=>({x,r:scoreFn(x)})).sort((a,b)=>b.r.s-a.r.s);
  const top=scored.filter(e=>e.r.s>-2).slice(0,4);
  const avoid=scored.filter(e=>e.r.s<=-2).slice(0,3);
  const row=e=>{const v=verdict(e.r.s);
    const note=esc((e.r.s<=-2?e.r.warn[0]:e.r.why[0])||e.r.warn[0]||"");
    return `<div class="bar" style="cursor:pointer;align-items:flex-start" onclick="${openFn}('${e.x.id}')">
      <span class="badge ${v.cls}" style="flex:none;margin-top:1px">${v.label}</span>
      <div style="flex:1;min-width:0"><b>${esc(labelFn(e.x))}</b>
        ${note?`<div class="muted" style="font-size:12px">${note}</div>`:""}</div></div>`;};
  return top.map(row).join("")+(avoid.length?`<div class="muted" style="font-size:11px;margin:8px 0 4px;letter-spacing:.4px">STEER CLEAR</div>`+avoid.map(row).join(""):"");
}

    h += S.papers.length

}

/* CSV export */
window.exportCSV=(kind)=>{
  const def=ENT[kind].def(), rows=ENT[kind].list();
  const cols=def.map(d=>d[0]);
  const cell=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(","))).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=`${kind}s_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported ${rows.length} ${kind}${rows.length===1?"":"s"}`);
};

/* sale listings */
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t);
  const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
  ta.select();document.execCommand("copy");ta.remove();return Promise.resolve();
}
function genListing(p){
  const price=p.est_value!=null&&p.est_value!==""?`$${p.est_value}`:"$___";
  const l=[`**[WTS] ${p.make} ${p.model}${p.material_color?" — "+p.material_color:""} (${price})**`];
  if(p.nib_grind||p.nib_material) l.push(`* Nib: ${[p.nib_grind,p.nib_material].filter(Boolean).join(", ")}${p.nibmeister?` — ground by ${p.nibmeister}`:""}`);
  if(p.filling) l.push(`* Filling: ${p.filling}`);
  if(p.year) l.push(`* Era: ${p.year}`);
  if(p.weight) l.push(`* Weight: ${p.weight}`);
  if(p.notes) l.push(`* Condition / notes: ${p.notes}`);
  l.push(`* Price: ${price} shipped CONUS, PayPal G&S`);
  return l.join("\n");
}

  color_match:["colormatch","colorfamily","primarycolor","primarycolormatch","family","hue","color","colour"],
  type:["type","format","bottlesample","container","sampleorbottle"],
  status:["status","keepdispose"],notes:["notes","comments","description"]},
 paper:{brand:["brand","maker","manufacturer"],name:["name","product","paper","notebook"],
  type:["type","format"],size:["size","dimensions"],gsm:["gsm","paperweight","gm2"],
  ruling:["ruling","lines","pattern"],surface:["surface","coating","finish"],
  rating:["rating","score","stars"],
  ghosting:["ghosting"],bleedthrough:["bleedthrough","bleed"],feathering:["feathering","feather"],
  price:["price","paid","cost"],status:["status"],notes:["notes","comments","description"]},
};
function parseTable(text){
  text=String(text||"").replace(/\r\n?/g,"\n").trim();
  if(!text)return[];
  const delim=text.split("\n")[0].includes("\t")?"\t":",";
  const rows=[];let row=[],cur="",inQ=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===delim){row.push(cur);cur="";}
    else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
    else cur+=ch;
  }
  row.push(cur);
  if(row.length>1||row[0].trim())rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
function autoMap(kind,headers){
  const syn=IMPORT_SYNONYMS[kind],used=new Set();
  return headers.map(h=>{
    const n=String(h).toLowerCase().replace(/[^a-z0-9]/g,"");
    for(const[f,alts]of Object.entries(syn)){
      if(used.has(f))continue;
      if(f.replace(/_/g,"")===n||alts.includes(n)){used.add(f);return f;}
    }
    for(const[f,alts]of Object.entries(syn)){
      if(used.has(f))continue;
      if(n.length>2&&alts.some(a=>n.includes(a)||a.includes(n))){used.add(f);return f;}
    }
    return "";
  });
}
function cleanMoneyJS(s){
  s=String(s??"").trim();if(!s||s==="-"||s==="—")return null;
  const neg=/^\(.*\)$/.test(s);
  s=s.replace(/[($),\s]/g,"").replace(/[^0-9.\-]/g,"");
  if(!s)return null;const v=parseFloat(s);return isNaN(v)?null:(neg?-v:v);
}
function cleanDateJS(s){
  s=String(s??"").trim();if(!s)return"";
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;}
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  return s;
}
window.openImport=(kind)=>{
  const keep=IW.kind===kind;
  IW={kind,raw:keep?IW.raw||"":"",
    xlsxFile:keep?IW.xlsxFile||null:null,
    xlsxRows:keep?IW.xlsxRows||null:null,
    xlsxSheets:keep?IW.xlsxSheets||null:null,
    xlsxSheet:keep?IW.xlsxSheet||null:null};
  modal(`<div class="sheet wide"><div class="head"><h2>Import ${kind}s · 1 of 3 — data</h2><button class="x" aria-label="Close" onclick="closeModal()">✕</button></div>
  <div class="body">
    <p class="muted" style="font-size:13px">Copy your rows in Excel / Google Sheets <b>including the header row</b>, then paste below — or choose a CSV or Excel file.</p>
    <textarea id="iw-paste" class="iw-ta" placeholder="Paste spreadsheet rows here…">${esc(IW.raw)}</textarea>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label class="btn sec">Choose CSV or Excel file<input id="iw-file" type="file" accept=".csv,.tsv,.txt,.xlsx" style="display:none"></label>
      <span id="iw-err" class="muted"></span>
    </div>
    <div id="iw-sheet-row" style="display:none;margin-top:8px"></div>
  </div>
  <div class="foot"><button class="btn sec" onclick="openData()">← Back</button>
    <button class="btn" onclick="iwToMap()">Next →</button></div></div>`);
  $("#iw-file").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(/\.xlsx$/i.test(f.name)){
      IW.xlsxFile=f;IW.xlsxRows=null;IW.xlsxSheets=null;IW.xlsxSheet=null;
      iwLoadXlsx();
    } else {
      IW.xlsxFile=null;IW.xlsxRows=null;IW.xlsxSheets=null;IW.xlsxSheet=null;
      $("#iw-sheet-row").style.display="none";$("#iw-sheet-row").innerHTML="";
      const r=new FileReader();r.onload=()=>{$("#iw-paste").value=r.result;};r.readAsText(f);
    }
  };
  iwRestoreXlsxUI();
};
// Re-render the sheet picker / status line from already-loaded xlsx state —
// used both after a fresh parse and when the wizard reopens (e.g. "← Back").
function iwRestoreXlsxUI(){
  if(!IW.xlsxRows)return;
  const err=$("#iw-err"), pickWrap=$("#iw-sheet-row");
  if(err) err.textContent=`${IW.xlsxRows.length-1} row${IW.xlsxRows.length-1===1?"":"s"} read from "${IW.xlsxSheet}".`;
  if(pickWrap && IW.xlsxSheets && IW.xlsxSheets.length>1){
    pickWrap.style.display="";
    pickWrap.innerHTML=`<label style="font-size:13px" class="muted">Sheet:
      <select id="iw-sheet-sel">${IW.xlsxSheets.map(s=>`<option value="${esc(s)}" ${s===IW.xlsxSheet?"selected":""}>${esc(s)}</option>`).join("")}</select></label>`;
    $("#iw-sheet-sel").onchange=e=>{iwLoadXlsx(e.target.value);};
  }
}
// Read the chosen .xlsx as base64 and hand it to the server-side parser
// (an xlsx is a zip of XML — no browser-side zip library is used or allowed).
// Optional sheetName re-parses a specific sheet (used by the sheet picker).
async function iwLoadXlsx(sheetName){
  const err=$("#iw-err"), pickWrap=$("#iw-sheet-row");
  if(err) err.innerHTML='<span class="spin"></span>Reading workbook…';
  try{
    const buf=await IW.xlsxFile.arrayBuffer();
    const bytes=new Uint8Array(buf);
    let binary="";const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
    const b64=btoa(binary);
    const body={filename:IW.xlsxFile.name,data:b64};
    if(sheetName) body.sheet=sheetName;
    const r=await fetch("/api/parse-xlsx",{method:"POST",headers:apiHeaders(),body:JSON.stringify(body)});
    const j=await r.json();
    if(!j.ok){
      IW.xlsxRows=null;
      if(err) err.textContent=(j.error||"Could not read that Excel file.")+" Try exporting as CSV instead.";
      if(pickWrap){pickWrap.style.display="none";pickWrap.innerHTML="";}
      return;
    }
    IW.xlsxSheets=j.sheets;IW.xlsxSheet=j.sheet;IW.xlsxRows=j.rows;
    iwRestoreXlsxUI();
  }catch(e){
    IW.xlsxRows=null;
    if(err) err.textContent="Could not read that Excel file. Try exporting as CSV instead.";
    if(pickWrap){pickWrap.style.display="none";pickWrap.innerHTML="";}
  }
}
window.iwToMap=()=>{
  let rows;
  if(IW.xlsxRows && IW.xlsxRows.length){
    rows=IW.xlsxRows;
  } else {
    IW.raw=$("#iw-paste").value;
    rows=parseTable(IW.raw);
  }
  if(rows.length<2){$("#iw-err").textContent="Need a header row plus at least one data row.";return;}
  IW.headers=rows[0].map(h=>String(h).trim());
  IW.rows=rows.slice(1);
  IW.mapping=autoMap(IW.kind,IW.headers);
  iwMapUI();
};
function iwMapUI(aiStatus){
  const def=ENT[IW.kind].def();
  const opts=f=>[`<option value="">— skip —</option>`]
    .concat(def.map(d=>`<option value="${d[0]}" ${f===d[0]?"selected":""}>${d[1]}</option>`)).join("");
  modal(`<div class="sheet wide"><div class="head"><h2>Import ${IW.kind}s · 2 of 3 — match columns</h2><button class="x" aria-label="Close" onclick="closeModal()">✕</button></div>
  <div class="body">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="muted" style="font-size:13px">${IW.rows.length} rows found. Check the matches:</span>
      <button class="btn sec" onclick="iwAiMap()">✨ AI match</button>
      <span id="iw-aistat" class="muted" style="font-size:13px">${esc(aiStatus||"")}</span>
    </div>
    <div class="iw-wrap"><table class="iw-tbl">
      <tr><th>Your column</th><th>First value</th><th>Imports as</th></tr>
      ${IW.headers.map((h,i)=>`<tr><td><b>${esc(h)}</b></td><td class="muted">${esc((IW.rows[0]||[])[i]||"")}</td>
        <td><select class="iw-map" data-i="${i}">${opts(IW.mapping[i])}</select></td></tr>`).join("")}
    </table></div>
  </div>
  <div class="foot"><button class="btn sec" onclick="openImport('${IW.kind}')">← Back</button>
    <button class="btn" onclick="iwPreview()">Preview →</button></div></div>`);
}
window.iwAiMap=async()=>{
  $("#iw-aistat").innerHTML='<span class="spin"></span>Matching columns…';
  try{
    const r=await fetch("/api/ai-map",{method:"POST",headers:apiHeaders(),
      body:JSON.stringify({kind:IW.kind,headers:IW.headers,
        fields:ENT[IW.kind].def().map(d=>d[0]),samples:IW.rows.slice(0,3)})});
    const j=await r.json();
    if(!j.ok){$("#iw-aistat").textContent=j.error||"AI matching failed";return;}
    const m=j.mapping||{};
    IW.mapping=IW.headers.map(h=>m[h]||"");
    iwMapUI("AI matched "+Object.keys(m).length+" columns — review below.");
  }catch(e){$("#iw-aistat").textContent="AI request error";}
};
window.iwPreview=()=>{
  IW.mapping=[...document.querySelectorAll(".iw-map")].map(s=>s.value);
  if(!IW.mapping.some(v=>v)){$("#iw-aistat").textContent="Map at least one column first.";return;}
  const moneyish=new Set(["paid","est_value","price","gsm"]);
  IW.records=IW.rows.map(r=>{
    const o={};
    IW.mapping.forEach((f,i)=>{ if(f) o[f]=String(r[i]??"").trim(); });
    for(const k of Object.keys(o)){
      if(moneyish.has(k)) o[k]=cleanMoneyJS(o[k]);
    }
    if(o.date_acquired) o.date_acquired=cleanDateJS(o.date_acquired);
    if(o.inked_date) o.inked_date=cleanDateJS(o.inked_date);
    if("shimmer" in o) o.shimmer=/^(y|yes|true|x|1|shimmer)/i.test(String(o.shimmer));
    if(o.color_match){
      let c=String(o.color_match).trim();
      c=c.charAt(0).toUpperCase()+c.slice(1).toLowerCase();
      if(c==="Gray")c="Grey";
      o.color_match=c;
    }
    if(!o.status) o.status="Keep";
    return o;
  }).filter(o=>Object.entries(o).some(([k,v])=>k!=="status"&&v!==""&&v!=null&&v!==false));
  const def=ENT[IW.kind].def();
  const shown=def.filter(d=>IW.mapping.includes(d[0]));
  modal(`<div class="sheet wide"><div class="head"><h2>Import ${IW.kind}s · 3 of 3 — review</h2><button class="x" aria-label="Close" onclick="closeModal()">✕</button></div>
  <div class="body">
    <p class="muted" style="font-size:13px"><b>${IW.records.length}</b> ${IW.kind}s ready to import. First rows:</p>
    <div class="iw-wrap"><table class="iw-tbl">
      <tr>${shown.map(d=>`<th>${d[1]}</th>`).join("")}</tr>
      ${IW.records.slice(0,8).map(o=>`<tr>${shown.map(d=>`<td>${esc(o[d[0]])}</td>`).join("")}</tr>`).join("")}
    </table></div>
    ${IW.records.length>8?`<p class="muted" style="font-size:12px">…and ${IW.records.length-8} more.</p>`:""}
  </div>
  <div class="foot"><button class="btn sec" onclick="iwMapUI()">← Back</button>
    <button class="btn" onclick="iwImport()">Import ${IW.records.length} ${IW.kind}s</button></div></div>`);
};
window.iwImport=async()=>{
  const kind=IW.kind, e=ENT[kind];
  IW.records.forEach(o=>{o.id=uid();o.photos=[];o.added_at=new Date().toISOString();e.list().push(o);});
  await e.save();
  const n=IW.records.length;IW={};
  closeModal();
  S.view="collection"; S.kind=kind;
  render();toast(`Imported ${n} record${n===1?"":"s"} ✓`);
};

/* ============================ overflow (⋯) menu ============================ */
window.toggleMoreMenu=()=>{
  const m=$("#moreMenu"); const willOpen=m.classList.contains("hidden");
  m.classList.toggle("hidden");
  $("#backdrop").classList.toggle("hidden", !willOpen);
  // #hdr is a sticky stacking context, so #moreMenu's own z-index is capped by the
  // header's. Lift the whole header above the backdrop while the menu is open,
  // otherwise the backdrop swallows every click on the menu.
  $("#hdr").classList.toggle("menuopen", willOpen);
};
window.closeMoreMenu=()=>{ $("#moreMenu").classList.add("hidden"); $("#backdrop").classList.add("hidden");
  $("#hdr").classList.remove("menuopen"); };
window.openSettings=()=>{
  modal(`<div class="sheet"><div class="head"><h2>⚙ Settings</h2><button class="x" aria-label="Close" onclick="closeModal()">✕</button></div>
    <div class="body">
      <h4 class="sech">DISPLAY</h4>
      <p class="muted" style="font-size:13px;margin:0 0 10px">Reset the remembered Collection layout and sort order back to defaults.</p>
      <button class="btn sec" onclick="localStorage.removeItem('pi_layout');localStorage.removeItem('pi_sort');S.layout='gallery';S.sort='';toast('Reset — reopen Collection to see it',true)">Reset layout &amp; sort</button>
      <h4 class="sech" style="margin-top:22px">THIS DEVICE</h4>
      <p class="muted" style="font-size:13px">Upload token used when this tracker is opened from your phone:</p>
      <p style="font-family:Consolas,monospace;font-size:12.5px;word-break:break-all">${esc(S.token||"—")}</p>
    </div></div>`);
};

/* ============================ command palette (⌘K / Ctrl+K) ============================ */
let PAL=null;
window.openPalette=()=>{
  PAL={items:buildPaletteItems(""),sel:0};
  $("#paletteRoot").innerHTML=`<div class="pal-overlay" onclick="if(event.target===this)closePalette()">
    <div class="pal-box">
      <input id="palInput" class="pal-input" placeholder="Search pens, inks, papers… or an action" autocomplete="off">
      <div class="pal-list" id="palList"></div>
    </div></div>`;
  renderPaletteList();
  const inp=document.getElementById("palInput");
  inp.oninput=()=>{PAL.items=buildPaletteItems(inp.value);PAL.sel=0;renderPaletteList();};
  inp.onkeydown=onPaletteKeydown;
  inp.focus();
};
window.closePalette=()=>{ $("#paletteRoot").innerHTML=""; PAL=null; };
function buildPaletteItems(raw){
  const q=raw.trim().toLowerCase();
  const has=s=>String(s||"").toLowerCase().includes(q);
  const actions=[
    {label:"+ Add a pen", act:()=>{closePalette();openAdd("pen");}},
    {label:"📷 Photo run", act:()=>{closePalette();startPhotoRun();}},
    {label:"🧾 Purchase records", act:()=>{closePalette();openRecords();}},
    {label:"⇄ Import / Export", act:()=>{closePalette();openData();}},
  ];
  let items=actions.filter(a=>!q||has(a.label)).map(a=>({type:"action",label:a.label,act:a.act}));
  S.pens.forEach(p=>{ const label=ENT.pen.label(p);
    if(!q||has(label)||has(p.nib_grind)||has(p.make)) items.push({type:"pen",label,
      act:()=>{closePalette();S.view="collection";S.kind="pen";render();openPen(p.id);}}); });
  S.inks.forEach(i=>{ const label=ENT.ink.label(i);
    if(!q||has(label)||has(i.brand)) items.push({type:"ink",label,
      act:()=>{closePalette();S.view="collection";S.kind="ink";render();openInk(i.id);}}); });
  S.papers.forEach(p=>{ const label=ENT.paper.label(p);
    if(!q||has(label)) items.push({type:"paper",label,
      act:()=>{closePalette();S.view="collection";S.kind="paper";render();openPaper(p.id);}}); });
  return items.slice(0,50);
}
function renderPaletteList(){
  const box=document.getElementById("palList"); if(!box)return;
  if(!PAL.items.length){ box.innerHTML=`<div class="pal-empty">Nothing matches.</div>`; return; }
  box.innerHTML=PAL.items.map((it,i)=>
    `<div class="pal-item ${i===PAL.sel?"sel":""}" onmouseenter="PAL.sel=${i};renderPaletteList()" onclick="PAL.items[${i}].act()">
      <span>${esc(it.label)}</span><span class="k">${it.type}</span></div>`).join("");
  const sel=box.querySelector(".pal-item.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
}
function onPaletteKeydown(e){
  if(!PAL)return;
  if(e.key==="ArrowDown"){e.preventDefault();PAL.sel=Math.min(PAL.sel+1,PAL.items.length-1);renderPaletteList();}
  else if(e.key==="ArrowUp"){e.preventDefault();PAL.sel=Math.max(PAL.sel-1,0);renderPaletteList();}
  else if(e.key==="Enter"){e.preventDefault();const it=PAL.items[PAL.sel];if(it)it.act();}
  else if(e.key==="Escape"){e.preventDefault();closePalette();}
}

/* ============================ wiring ============================ */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.view=t.dataset.view;toggleSide(false);render();});
document.querySelectorAll("#bottomNav button[data-nav]").forEach(b=>b.onclick=()=>{
  const v=b.dataset.nav;
  if(v==="add"){ $("#addBtn").click(); return; }
  if(v==="more"){ toggleMoreMenu(); return; }
  S.view=v; render();
});
$("#search").oninput=e=>{S.search=e.target.value;if(S.view==="collection")renderCards();};
$("#sort").onchange=e=>{S.sort=e.target.value;localStorage.setItem("pi_sort",S.sort);renderCards();};
document.querySelectorAll("#layoutSeg button[data-layout]").forEach(b=>b.onclick=()=>setLayout(b.dataset.layout));
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openPalette(); return; }
  if(e.key==="Escape"){
    if(PAL){ closePalette(); return; }
    if(!$("#lightbox").classList.contains("hidden")){ $("#lightbox").classList.add("hidden"); return; }
    if(!$("#moreMenu").classList.contains("hidden")){ closeMoreMenu(); return; }
    closeModal();
  }
});

load();
