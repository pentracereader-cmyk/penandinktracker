<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1319">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pen &amp; Ink">
<title>Pen &amp; Ink Tracker</title>
<style>
:root{
  --bg:#0F1319; --panel:#171C24; --panel2:#1F2530; --line:#2C3440;
  --txt:#E8EAEE; --muted:#97A0AE;
  --accent:#D4AF37; --accent2:#B8952C;
  --good:#3FB27F; --warn:#E08A3C; --bad:#E05C4A; --gift:#9B7BD6;
  --sunken:#12161C;      /* recessed wells, chart tracks */
  --border-ctl:#6B7488;  /* control boundaries — 3.28:1, WCAG 1.4.11 */
  --on-accent:#0F1319;   /* text/icons on an accent fill — 8.86:1 */
  --radius:12px; --shadow:0 8px 30px rgba(0,0,0,.45);
  --sans:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
  --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 var(--sans)}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* header */
#hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:rgba(15,19,25,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
#brand{font-weight:700;font-size:18px;letter-spacing:.3px;white-space:nowrap}
#brand span{color:var(--muted);font-weight:400;font-size:13px}
#tabs{display:flex;gap:4px;margin-left:8px}
.tab{background:transparent;border:1px solid transparent;color:var(--muted);
  padding:7px 14px;border-radius:8px}
.tab.active{background:var(--panel2);color:var(--txt);border-color:var(--line)}
#search{flex:1;max-width:420px;margin-left:auto;background:var(--panel2);
  border:1px solid var(--border-ctl);color:var(--txt);padding:9px 12px;border-radius:9px}
#searchIconBtn{display:none;background:none;border:none;color:var(--muted);width:40px;height:40px;
  border-radius:9px;align-items:center;justify-content:center}
#searchIconBtn svg{width:19px;height:19px}
.btn{background:var(--accent);color:var(--on-accent);border:none;padding:9px 16px;border-radius:9px;font-weight:600}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

#layout{display:flex;align-items:flex-start}
#side{width:230px;flex:none;padding:18px 14px;position:sticky;top:57px;
  height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line)}
#main{flex:1;padding:18px 22px;min-width:0}
.fgroup{margin-bottom:18px}
.fgroup h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);padding:5px 10px;border-radius:20px;
  font-size:13px;margin:0 6px 6px 0}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip small{color:var(--muted)}
.chip.on small{color:var(--on-accent);opacity:.75}
.chip.more{background:transparent;border-style:dashed;color:var(--muted)}

#meta{display:flex;align-items:center;gap:14px;margin-bottom:14px;color:var(--muted);font-size:13px}
#meta .spacer{flex:1}
.viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtog button{background:var(--panel);border:none;color:var(--muted);padding:6px 12px}
.viewtog button.on{background:var(--panel2);color:var(--txt)}

/* pens: gallery/compact segmented toggle */
.segs{display:flex;gap:2px;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.segs button{background:none;border:0;color:var(--muted);font:600 12.5px/1 var(--sans);
  padding:7px 12px;border-radius:6px;cursor:pointer}
.segs button.on{background:var(--panel);color:var(--txt)}

/* pens: gallery cards (photo-first, uniform height so the grid never reflows) */
#cards.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;padding:0;text-align:left;font:inherit;color:inherit;width:100%;
  display:flex;flex-direction:column;transition:transform .08s,border-color .08s}
.gcard:hover{transform:translateY(-2px);border-color:var(--accent2)}
.gcard .media{aspect-ratio:3/2;position:relative;background:var(--sunken);display:grid;
  place-items:center;overflow:hidden}
.gcard .media img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .media .sil{width:84%;max-width:204px;height:auto}
.gcard .media .pend{position:absolute;left:8px;bottom:8px;font:600 9.5px/1 var(--sans);
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:4px 7px}
.gcard .media .cnt{position:absolute;right:8px;bottom:8px;font:600 10px/1 var(--sans);
  color:#fff;background:rgba(8,11,15,.66);border-radius:999px;padding:4px 8px}
.gcard .media .badge{position:absolute;top:8px;right:8px;margin:0;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.gcard .gb{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}
.gcard .nm{font-family:var(--serif);font-size:13.5px;font-weight:700;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .mat{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);overflow:hidden}
.gcard .mat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .spec{margin-top:5px;font:600 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.gcard .foot{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:auto;padding-top:9px;
  border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.gcard .foot .paid{font-size:11.5px;color:var(--muted)}
.gcard .foot .est{font-size:14px;font-weight:700}

/* pens: compact rows (nib-forward) */
#cards.compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.pen{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;
  transition:border-color .08s}
.pen:hover{border-color:var(--accent2);background:var(--panel2)}
.pen .nib,.pen .media{width:44px;height:60px;display:block;object-fit:cover;border-radius:6px}
.pen .mid{min-width:0}
.pen .nm{font-family:var(--serif);font-size:14px;font-weight:700;line-height:1.25;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen .mat{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted);overflow:hidden}
.pen .mat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen .spec{margin-top:5px;font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.pen .money{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.pen .money .paid{font-size:12px;color:var(--muted)}
.pen .money .est{font-size:15px;font-weight:700;margin-top:2px}
.pen .money .badge{margin-top:4px}
.matdot{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.34)}

/* grid */
#cards.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .08s,border-color .08s}
.card:hover{transform:translateY(-2px);border-color:var(--accent2)}
.card .ph{aspect-ratio:4/3;background:var(--panel2);display:flex;align-items:center;
  justify-content:center;color:var(--muted);overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .swatch{width:100%;height:100%}
.card .bd{padding:10px 12px}
.card .t{font-family:var(--serif);font-weight:600;line-height:1.25}
.card .s{color:var(--muted);font-size:13px;margin-top:2px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.b-Keep{background:rgba(75,181,107,.18);color:var(--good)}
.b-Sold{background:rgba(154,163,178,.18);color:var(--muted)}
.b-Gift{background:rgba(155,108,214,.18);color:var(--gift)}
.b-WillSell{background:rgba(226,96,74,.18);color:var(--bad)}
.b-Listed{background:rgba(224,169,59,.18);color:var(--warn)}
.b-Undecided{background:rgba(212,175,55,.16);color:var(--accent)}
.b-Dispose{background:rgba(226,96,74,.18);color:var(--bad)}
.pricetag{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pricetag b{color:var(--txt)}

/* list */
#cards.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden}
.lrow{display:grid;grid-template-columns:46px 1.6fr 1fr .8fr .7fr 90px;gap:12px;align-items:center;
  background:var(--panel);padding:9px 14px;cursor:pointer}
.lrow:hover{background:var(--panel2)}
.lrow .li{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--panel2)}
.lrow .swatch{width:46px;height:46px;border-radius:8px}
.lrow .muted{color:var(--muted);font-size:13px}
.lrow .money{font-variant-numeric:tabular-nums}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;display:flex;
  align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:760px;box-shadow:var(--shadow);position:relative}
.sheet.wide{max-width:880px}
.sheet h2{margin:0;font-size:19px;text-wrap:balance}
.sheet .head h2{font-family:var(--serif)}
h1,h2,h3,h4{text-wrap:balance}
.sheet .head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet .head .x{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:22px}
.sheet .body{padding:20px 22px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--border-ctl);
  color:var(--txt);padding:9px 11px;border-radius:9px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.aihint{font-size:12px;color:var(--accent);margin-top:3px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px}
.gphoto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2)}
.gphoto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.gphoto .del{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border:none;
  color:#fff;border-radius:6px;padding:2px 7px;font-size:12px}
.addphoto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:1;color:var(--muted);background:transparent}

/* qr */
#qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#qrcanvas{background:#fff;padding:12px;border-radius:12px}
#qrcanvas img{display:block}
.kv{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:13px;justify-content:center}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px;margin-top:3px}
.stat .sub{font-size:12px;margin-top:6px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.dpanels{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.dpanel h3{margin:0 0 12px;font-size:15px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.bar .lab{width:130px;flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{flex:1;background:var(--panel2);border-radius:6px;height:10px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .val{width:42px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}

#menuBtn{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:8px 13px;border-radius:9px;font-size:16px;line-height:1}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
#hdr.menuopen{z-index:45}   /* see toggleMoreMenu(): beats #backdrop so the menu is clickable */

/* ── overflow (⋯) menu ─────────────────────────────────────────────────── */
#moreMenu{position:absolute;top:calc(100% + 8px);right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:41;
  min-width:200px;overflow:hidden;padding:6px}
#moreMenu button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--txt);padding:9px 11px;border-radius:7px;font-size:13.5px}
#moreMenu button:hover{background:var(--panel2)}

/* ── Today ─────────────────────────────────────────────────────────────── */
#todayView{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:22px;align-items:start}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.headline{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.02em;
  margin-top:8px;line-height:1.15}
.subline{font-size:14px;color:var(--muted);margin-top:7px;max-width:64ch;line-height:1.6}
.inked-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.inked-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px}
.inked-row .nm{font-family:var(--serif);font-weight:700;font-size:13.5px}
.inked-row .ink{color:var(--muted);font-size:12.5px;margin-top:2px}
.inked-row .days{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.sec-head .line{height:1px;background:var(--line);flex:1}
.pairing{display:grid;grid-template-columns:132px 30px minmax(0,1fr) auto;gap:16px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:9px}
.pairing .sil{width:132px;height:auto}
.pairing .swatch{width:30px;height:30px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -8px 12px rgba(0,0,0,.32)}
.pairing .txt b{font-family:var(--serif);font-size:14.5px;font-weight:700}
.pairing .why{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.pairing .go{font-size:12.5px;font-weight:700;color:var(--on-accent);background:var(--accent);
  border:none;border-radius:6px;padding:9px 14px;white-space:nowrap}
.steerclear{display:flex;gap:13px;align-items:flex-start;background:rgba(224,92,74,.09);
  border:1px solid rgba(224,92,74,.34);border-radius:12px;padding:14px 16px;margin-top:4px}
.steerclear b{color:var(--bad);font-size:13px}
.steerclear .why{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.empty-today{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center}
.empty-today .headline{font-size:22px}
.rail-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px 18px}
.rail-panel + .rail-panel{margin-top:14px}
.rail-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.rail-row b{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.rail-hr{height:1px;background:var(--line);margin:11px 0}
.rail-todo{display:flex;align-items:center;gap:11px;font-size:13px;line-height:1.4}
.rail-todo .n{font-family:var(--serif);font-size:19px;font-weight:700;width:30px;flex:none;
  font-variant-numeric:tabular-nums;color:var(--muted)}
.progress-track{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:var(--accent);border-radius:3px}
.progress-lab{font-size:11.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* ── Collection: Kind facet + Table layout ────────────────────────────── */
#cards.table{display:block}
.coltbl{width:100%;border-collapse:collapse;font-size:13px}
.coltbl th,.coltbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.coltbl th{position:sticky;top:0;background:var(--bg);color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
.coltbl th:hover{color:var(--txt)}
.coltbl tbody tr{cursor:pointer}
.coltbl tbody tr:hover{background:var(--panel2)}
.coltbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.kindpill{position:absolute;top:8px;left:8px;font:600 9.5px/1 var(--sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px 7px}

/* ── Purchase records ──────────────────────────────────────────────────── */
.recwrap{display:flex;flex-direction:column;gap:16px}
.rec-head{display:flex;align-items:flex-end;gap:20px}
.rec-head h1{font-family:var(--serif);font-size:27px;margin:8px 0 0;letter-spacing:-.02em}
.rec-head .crumb{font-size:12px;color:var(--muted)}
.rec-head .sub{font-size:14px;color:var(--muted);margin-top:6px;max-width:66ch;line-height:1.6}
.rec-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.rec-pin{border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.05)}
.rectbl{width:100%;border-collapse:collapse;font-size:13px}
.rectbl th,.rectbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.rectbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  cursor:pointer;user-select:none}
.rectbl td.num,.rectbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.rec-foot{display:flex;align-items:center;gap:18px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted)}

/* ── pen detail: reading view ──────────────────────────────────────────── */
.pd-wrap{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:20px}
.pd-panel{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px}
.pd-nib{display:grid;grid-template-columns:96px minmax(0,1fr);gap:22px;align-items:center}
.pd-nib svg.nib{width:96px;height:auto}
.pd-nib h3{font-family:var(--serif);font-size:22px;font-weight:700;margin:7px 0 0}
.pd-nib p{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.6;max-width:56ch}
.pd-chips{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.pd-chip{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted)}
.pd-chip.good{background:rgba(63,178,127,.14);border-color:rgba(63,178,127,.3);color:var(--good)}
.pd-notes{border-left:2px solid var(--accent)}
.pd-notes .body{font-size:14px;line-height:1.72;margin-top:11px;max-width:68ch;white-space:pre-wrap}
.pd-kv{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px 14px;font-size:13.5px}
.pd-kv dt{color:var(--muted);margin:0}
.pd-kv dd{margin:0;font-variant-numeric:tabular-nums}
.pd-askrow{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.pd-journal .jrow{padding:10px 0;border-top:1px solid var(--line)}
.pd-journal .jrow:first-of-type{border-top:none;padding-top:11px}
.pd-journal .jdate{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:4px}
.pd-journal .jtext{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.pd-journal .jadd{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pd-journal .jadd textarea{background:var(--panel);border:1px solid var(--border-ctl);color:var(--txt);
  border-radius:8px;padding:9px 10px;font:inherit;resize:vertical}
.pd-journal .jadd button{align-self:flex-end}

/* ── capture flow ──────────────────────────────────────────────────────── */
.soldtag{display:inline-block;margin-left:6px;background:rgba(212,175,55,.16);color:var(--accent);
  border-radius:999px;padding:2px 7px;font:600 10px/1.5 var(--sans);letter-spacing:.04em;
  text-transform:uppercase;vertical-align:1px}
.cap-text{width:100%;margin-top:10px;background:var(--panel2);border:1px solid var(--border-ctl);
  color:var(--txt);border-radius:9px;padding:11px 12px;font:13px/1.55 var(--sans);resize:vertical}
.cap-input{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--accent);
  border-radius:12px;padding:12px 14px}
.cap-input input{flex:1;background:transparent;border:none;color:var(--txt);font-size:14px;padding:0}
.cap-input input:focus{outline:none}
.cap-reads{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.cap-reads .lbl2{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cap-reads span.pill{font-size:11.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;color:var(--txt)}
.cap-multi{background:rgba(224,138,60,.08);border:1px solid rgba(224,138,60,.42);border-radius:12px;padding:15px 17px;margin-top:14px}
.cap-multi h4{color:var(--warn);font-size:13.5px;margin:0}
.cap-lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:13px}
.cap-lot{border:1px solid var(--line);background:var(--sunken);border-radius:9px;padding:10px 11px;cursor:pointer}
.cap-lot.on{border-color:var(--accent);background:rgba(212,175,55,.09)}
.cap-draft{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px;
  display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px}
.cap-fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 15px}
.cap-field{display:flex;flex-direction:column;gap:6px}
.cap-field.full{grid-column:1/-1}
.cap-fname{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cap-fval{background:var(--panel2);border:1px solid var(--border-ctl);border-radius:7px;padding:9px 11px;
  font-size:13.5px;color:var(--txt);width:100%}
.cap-fval.needs{border-color:var(--warn)}
.cap-src{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cap-src.needs{color:var(--warn)}
.cap-src i{width:5px;height:5px;border-radius:50%;background:var(--muted);display:block;flex:none}
.cap-src.post i{background:var(--accent)}
.cap-confirm{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--good)}

/* ── command palette ──────────────────────────────────────────────────── */
#paletteRoot:empty{display:none}
.pal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;
  align-items:flex-start;justify-content:center;padding:12vh 16px}
.pal-box{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal-input{width:100%;background:var(--panel2);border:none;border-bottom:1px solid var(--line);
  color:var(--txt);padding:16px 18px;font-size:16px}
.pal-input:focus{outline:none}
.pal-list{max-height:50vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px}
.pal-item .k{margin-left:auto;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pal-item.sel{background:var(--panel2)}
.pal-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}

/* ── mobile bottom nav ────────────────────────────────────────────────── */
#bottomNav{display:none}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;display:flex;
  align-items:center;justify-content:center;padding:30px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);padding:12px 20px;border-radius:10px;z-index:90;box-shadow:var(--shadow);
  font-weight:600;animation:toastIn .18s ease-out}
#toast.ok{border-color:var(--good);color:var(--good)}
#toast.ok::before{content:"✓ "}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
.empty{color:var(--muted);text-align:center;padding:60px 20px}

/* AI busy spinner */
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;
  vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
/* swab wall */
#cards.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.wtile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;
  background:var(--panel2);transition:transform .08s}
.wtile:hover{transform:scale(1.03);z-index:2}
.wtile img,.wtile .wcolor{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wlabel{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:11px;line-height:1.3;
  color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-shadow:0 1px 2px rgba(0,0,0,.8)}

/* photo tag badge */
.tagb{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.65);border:none;color:#fff;
  border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer}
.tagb:hover{background:var(--accent2);color:var(--on-accent)}

/* photo editor (crop / rotate) */
#pe-canvas{max-width:100%;max-height:60vh;touch-action:none;border-radius:10px;
  background:#000;cursor:crosshair;display:block;margin:0 auto}
.pe-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.topbtns{position:absolute;top:5px;right:5px;display:flex;gap:3px}
.topbtns button{background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:6px;
  min-width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 4px}
.topbtns button:hover{background:var(--accent2);color:var(--on-accent)}
.topbtns button.delx:hover{background:rgba(226,96,74,.9)}

/* photo default + reorder controls */
.defb{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);border:none;
  border-radius:6px;padding:2px 7px;font-size:11px;color:#fde68a}
button.defb{cursor:pointer}
button.defb:hover{background:var(--accent2);color:var(--on-accent)}
.movebtns{position:absolute;bottom:5px;right:5px;display:flex;gap:3px}
.movebtns button{background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:6px;
  width:22px;height:22px;font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.movebtns button:disabled{opacity:.25;cursor:default}
.movebtns button:not(:disabled):hover{background:var(--accent2);color:var(--on-accent)}

/* import wizard */
.sech{margin:0 0 6px;color:var(--muted);font-size:12px;letter-spacing:.5px}
.iw-ta{width:100%;min-height:150px;background:var(--panel2);border:1px solid var(--border-ctl);
  color:var(--txt);border-radius:9px;padding:10px;font:12px/1.5 Consolas,monospace;resize:vertical}
.iw-wrap{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:9px;margin-top:10px}
.iw-tbl{border-collapse:collapse;width:100%;font-size:13px}
.iw-tbl th,.iw-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;
  white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.iw-tbl th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.4px}
.iw-tbl select{background:var(--panel2);border:1px solid var(--border-ctl);color:var(--txt);
  padding:5px 8px;border-radius:7px;max-width:180px}

/* ── phone / small screens ─────────────────────────────────────────────── */
@media(max-width:820px){
  #hdr{height:52px;flex-wrap:nowrap;gap:8px;padding:0 12px;overflow:hidden}
  #brand{font-size:15.5px}
  #brand span{display:none}
  #tabs{display:none}
  #search{display:none}
  #searchIconBtn{display:flex;margin-left:auto}
  /* filter rail toggle: only meaningful (and shown) in Collection — render()
     applies .hidden the rest of the time so the 52px row stays uncluttered
     on Today/Records while the slide-over filter rail stays reachable. */
  #menuBtn{display:inline-block}
  #moreBtn{padding:8px 10px}
  #addBtn{display:none}
  #side{position:fixed;top:0;left:0;bottom:0;z-index:40;width:280px;max-width:85vw;
    height:100vh;background:var(--bg);border-right:1px solid var(--line);
    transform:translateX(-105%);transition:transform .2s ease;padding-top:18px}
  #side.open{transform:none}
  #main{padding:12px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  #cards.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .lrow{grid-template-columns:46px 1fr 92px}
  .lrow>div:nth-child(3),.lrow>div:nth-child(4),.lrow>div:nth-child(5){display:none}
  .overlay{padding:0}
  .sheet,.sheet.wide{max-width:100%;min-height:100vh;border-radius:0}
  .fields{grid-template-columns:1fr}
  .dpanels{grid-template-columns:1fr}
  .btn,.chip{min-height:40px}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  #cards.gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  #cards.compact{grid-template-columns:1fr}
  #todayView{grid-template-columns:1fr}
  .pairing{grid-template-columns:70px 22px minmax(0,1fr);row-gap:8px}
  .pairing .sil{width:70px}
  .pairing .go{grid-column:1/-1;text-align:center}
  .pd-wrap{grid-template-columns:1fr}
  .cap-draft{grid-template-columns:1fr}
  .cap-fgrid{grid-template-columns:1fr 1fr}
  #bottomNav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;
    z-index:35;border-top:1px solid var(--line);background:rgba(15,19,25,.96);backdrop-filter:blur(8px);
    padding-bottom:env(safe-area-inset-bottom)}
  #bottomNav button{background:none;border:none;color:var(--muted);display:grid;place-items:center;
    align-content:center;gap:4px;min-height:52px;padding:6px 4px}
  #bottomNav button svg{width:21px;height:21px}
  #bottomNav button span{font-size:10.5px;font-weight:600}
  #bottomNav button.on{color:var(--accent)}
  #moreMenu{position:fixed;left:12px;right:12px;top:auto;bottom:calc(64px + env(safe-area-inset-bottom));
    width:auto}
}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="hdr">
  <button id="menuBtn" onclick="toggleSide()" title="Filters" aria-label="Show filters">☰</button>
  <div id="brand">✒ Pen &amp; Ink <span>Tracker</span></div>
  <div id="tabs" role="tablist" aria-label="Sections">
    <button class="tab active" role="tab" aria-selected="true" data-view="today">Today</button>
    <button class="tab" role="tab" aria-selected="false" data-view="collection">Collection</button>
  </div>
  <input id="search" placeholder="Search or jump to… (⌘K)">
  <button id="searchIconBtn" onclick="openPalette()" title="Search" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4" stroke-linecap="round"/></svg>
  </button>
  <div style="position:relative">
    <button id="moreBtn" class="btn sec" onclick="toggleMoreMenu()" title="More" aria-label="More options">⋯</button>
    <div id="moreMenu" class="hidden">
      <button onclick="closeMoreMenu();openRecords()">🧾 Purchase records</button>
      <button onclick="closeMoreMenu();openData()">⇄ Import / Export</button>
      <button onclick="closeMoreMenu();startPhotoRun()">📷 Photo run</button>
      <button onclick="closeMoreMenu();openAppQR()">📱 Open on your phone</button>
      <button onclick="closeMoreMenu();openSettings()">⚙ Settings</button>
    </div>
  </div>
  <button class="btn" id="addBtn">+ Add</button>
</div>
<div id="backdrop" class="hidden" onclick="toggleSide(false);closeMoreMenu()"></div>

<div id="layout">
  <aside id="side"></aside>
  <main id="main">
    <div id="todayView" class="hidden"></div>
    <div id="collectionView" class="hidden">
      <div id="meta">
        <span id="count"></span>
        <span class="spacer"></span>
        <select id="sort" class="btn sec"></select>
        <div class="segs" id="layoutSeg" role="group" aria-label="Card layout">
          <button data-layout="gallery" class="on" aria-pressed="true">▦ Gallery</button>
          <button data-layout="compact" aria-pressed="false">☰ Compact</button>
          <button data-layout="table" aria-pressed="false">▤ Table</button>
          <button data-layout="wall" id="wallBtn" class="hidden" aria-pressed="false">🎨 Wall</button>
        </div>
      </div>
      <div id="cards" class="grid"></div>
    </div>
    <div id="recordsView" class="hidden"></div>
  </main>
</div>

<!-- mobile-only bottom nav: Today / Collection / Add / More -->
<nav id="bottomNav" aria-label="Primary">
  <button data-nav="today" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3.5 20.5 9 9 20.5l-5.5.5.5-5.5z"/><path d="m13 5.5 5.5 5.5"/></svg>
    <span>Today</span>
  </button>
  <button data-nav="collection">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="4.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="14" width="7" height="5.5" rx="1.4"/><rect x="13.5" y="14" width="7" height="5.5" rx="1.4"/></svg>
    <span>Collection</span>
  </button>
  <button data-nav="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add</span>
  </button>
  <button data-nav="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
    <span>More</span>
  </button>
</nav>

<div id="modalRoot"></div>
<div id="lightbox" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="paletteRoot"></div>

<script src="qrcode.min.js"></script>
<script>
/* ============================ state ============================ */
const STATUS = ["Keep","Undecided","Listed","Will Sell","Sold","Gift","Incoming"];
const SHEENS = ["None","Gold","Blue","Silver","Red","Green","Pink"];
const COLORS = ["Red","Orange","Yellow","Green","Brown","Blue","Purple","Grey","Black"];
const INKSTATUS = ["Keep","Dispose"];
const INKTYPE = ["Bottle","Sample"];
const PAPERTYPES = ["Notebook","Pad","Loose Sheets","Journal","Other"];
const RULINGS = ["","Blank","Lined","Grid","Dot"];
const SEVERITY = ["","None","Slight","Moderate","Severe"];
const TAG_LABEL = {photo:"📷 Photo", swab:"🎨 Swab", writing:"✍ Writing"};
const TAG_ORDER = ["photo","swab","writing"];
const COLOR_HEX = {Red:"#c0392b",Orange:"#e67e22",Yellow:"#e6c520",Green:"#27ae60",
  Brown:"#8a5a2b",Blue:"#2d6cdf",Purple:"#8e44ad",Grey:"#7d8590",Black:"#1c1c1c"};

const S = { pens:[], inks:[], papers:[], photos:{}, view:"today", kind:"all",
  layout: localStorage.getItem("pi_layout") || "gallery",
  sort:   localStorage.getItem("pi_sort")   || "",
  search:"", filters:{}, filterOpen:{}, token:"" };

// All mutating calls carry the per-run token so the app works from the phone too.
function apiHeaders(){ return {"Content-Type":"application/json","X-Upload-Token":S.token}; }

const $ = s=>document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = ()=> (Date.now().toString(36)+Math.random().toString(36).slice(2,7)).replace(/[^a-z0-9]/g,"").slice(0,20);
const money = v => v==null||v===""?"—":"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const photosFor = (type,id)=> S.photos[type+":"+id] || [];
// photo entries are {url, tag} (server normalizes old string entries)
const photoUrl = e => typeof e==="string" ? e : e.url;
const photoTag = e => typeof e==="string" ? "photo" : (e.tag||"photo");
function firstPhoto(type,id,prefTag){
  const ps=photosFor(type,id); if(!ps.length) return null;
  if(prefTag){ const m=ps.find(p=>photoTag(p)===prefTag); if(m) return photoUrl(m); }
  return photoUrl(ps[0]);
}
const hasInk = p => !!(p.inked_with && String(p.inked_with).trim());
function toast(m,ok){const t=$("#toast");t.textContent=m;t.classList.toggle("ok",!!ok);t.classList.remove("hidden");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),ok?2600:2200);}

/* ============================ load/save ============================ */
async function load(){
  try{ const i = await (await fetch("/api/qr-info")).json(); S.token = i.token; }catch(e){}
  const d = await (await fetch("/api/data")).json();
  S.pens=d.pens||[]; S.inks=d.inks||[]; S.papers=d.papers||[]; S.photos=d.photos||{};
  render();
}
async function refreshPhotos(){
  const d = await (await fetch("/api/data")).json();
  S.photos = d.photos||{};
}
// Header ⟳ — reload everything from disk without losing the current view/filters
window.refreshData=async()=>{
  const b=$("#refreshBtn");if(b)b.disabled=true;
  try{
    const d=await (await fetch("/api/data")).json();
    S.pens=d.pens||[];S.inks=d.inks||[];S.papers=d.papers||[];S.photos=d.photos||{};
    CATALOG=null;
    render();
    toast("Refreshed");
  }catch(e){toast("Refresh failed");}
  if(b)b.disabled=false;
};
async function savePens(){ await fetch("/api/save-pens",{method:"POST",headers:apiHeaders(),body:JSON.stringify(S.pens)});}
async function saveInks(){ await fetch("/api/save-inks",{method:"POST",headers:apiHeaders(),body:JSON.stringify(S.inks)});}
async function savePapers(){ await fetch("/api/save-papers",{method:"POST",headers:apiHeaders(),body:JSON.stringify(S.papers)});}

/* entity registry — one place that knows the three collections */
const ENT = {
  pen:   { list:()=>S.pens,   save:savePens,   def:()=>PEN_DEF,
           label:r=>`${r.make||""} ${r.model||""}`.trim(),
           seeds:[["make","Make","e.g. Pelikan"],["model","Model","e.g. M800"]] },
  ink:   { list:()=>S.inks,   save:saveInks,   def:()=>INK_DEF,
           label:r=>`${r.brand||""} ${r.name||""}`.trim(),
           seeds:[["brand","Brand","e.g. Diamine"],["name","Name","e.g. Oxblood"]] },
  paper: { list:()=>S.papers, save:savePapers, def:()=>PAPER_DEF,
           label:r=>`${r.brand||""} ${r.name||""}`.trim(),
           seeds:[["brand","Brand","e.g. Midori"],["name","Product","e.g. MD Notebook A5"]] },
};
const viewKind = () => (S.view==="collection" && S.kind!=="all") ? S.kind : "pen";

/* ============================ filtering ============================ */
function statusClass(s){return "b-"+String(s||"").replace(/\s+/g,"");}
// Collection is one surface now; S.kind ("all"/"pen"/"ink"/"paper") picks which
// slice the Kind facet shows. "all" merges the three lists into {kind,rec} tuples.
function activeList(){
  if(S.kind==="ink") return filterInks();
  if(S.kind==="paper") return filterPapers();
  if(S.kind==="pen") return filterPens();
  const q=S.search.toLowerCase();
  const matches=(o,fields)=>!q||fields.some(f=>String(o[f]||"").toLowerCase().includes(q));
  let out=[];
  S.pens.forEach(p=>{if(matches(p,["make","model","material_color","nib_grind","nib_material","status"])
    && passFacets(p,{status:x=>x.status,make:x=>x.make}) && passSold(p))out.push({kind:"pen",rec:p});});
  S.inks.forEach(i=>{if(matches(i,["brand","name","color_match","status"])
    && passFacets(i,{status:x=>x.status,make:x=>x.brand}))out.push({kind:"ink",rec:i});});
  S.papers.forEach(p=>{if(matches(p,["brand","name","type","status"])
    && passFacets(p,{status:x=>x.status,make:x=>x.brand}))out.push({kind:"paper",rec:p});});
  const num=v=>v==null?-Infinity:Number(v);
  const lab=o=>ENT[o.kind].label(o.rec);
  if(S.sort==="paid_desc") out.sort((a,b)=>num(b.rec.paid ?? b.rec.price)-num(a.rec.paid ?? a.rec.price));
  else if(S.sort==="paid_asc") out.sort((a,b)=>num(a.rec.paid ?? a.rec.price)-num(b.rec.paid ?? b.rec.price));
  else if(S.sort==="date_desc") out.sort((a,b)=>String(b.rec.added_at||"").localeCompare(String(a.rec.added_at||"")));
  else if(S.sort==="date_asc") out.sort((a,b)=>String(a.rec.added_at||"").localeCompare(String(b.rec.added_at||"")));
  else if(S.sort==="name") out.sort((a,b)=>lab(a).localeCompare(lab(b)));
  return out;
}
function matchSearch(obj, fields){
  if(!S.search) return true;
  const q=S.search.toLowerCase();
  return fields.some(f=>String(obj[f]||"").toLowerCase().includes(q));
}
// S.filters[key] is a Set of accepted string values for that facet; a record
// matches a facet group when its (stringified) value is a member of the Set.
// Facets are AND'd together; values within one facet's Set are OR'd.
function passFacets(obj, getters){
  for(const k in S.filters){
    const set=S.filters[k]; if(!set||!set.size) continue;
    const getter=getters[k]; if(!getter) continue;
    if(!set.has(String(getter(obj)))) return false;
  }
  return true;
}
// Sold pens are hidden by default (they clutter browsing once a pen is gone) —
// click the "Sold" chip in the Status facet to bring them back into view.
function passSold(p){
  return p.status!=="Sold" || (S.filters.status && S.filters.status.has("Sold"));
}
function filterPens(){
  let r=S.pens.filter(p=>matchSearch(p,["make","model","material_color","nib_grind","nib_material","nibmeister","source","notes","status"]));
  r=r.filter(p=>passFacets(p,{
    make:x=>x.make, status:x=>x.status, nib_material:x=>x.nib_material,
    fits_hand:x=>x.fits_hand, inked:x=>hasInk(x)?"yes":"no",
  }));
  r=r.filter(passSold);
  r=sortList(r);
  return r;
}
function filterPapers(){
  let r=S.papers.filter(p=>matchSearch(p,["brand","name","type","size","ruling","notes","status"]));
  r=r.filter(p=>passFacets(p,{
    type:x=>x.type, ruling:x=>x.ruling, brand:x=>x.brand, rating:x=>x.rating, status:x=>x.status,
  }));
  return sortList(r);
}
function filterInks(){
  let r=S.inks.filter(i=>matchSearch(i,["brand","name","color_match","sheen","notes","status","type"]));
  r=r.filter(i=>passFacets(i,{
    color_match:x=>x.color_match, sheen:x=>x.sheen, shimmer:x=>String(!!x.shimmer),
    type:x=>x.type, status:x=>x.status, alkaline:x=>x.alkaline||"",
  }));
  r=sortList(r);
  return r;
}
function sortList(r){
  const s=S.sort;
  const num=v=>v==null?-Infinity:Number(v);
  if(s==="paid_desc") r.sort((a,b)=>num(b.paid)-num(a.paid));
  else if(s==="paid_asc") r.sort((a,b)=>num(a.paid)-num(b.paid));
  else if(s==="date_desc") r.sort((a,b)=>String(b.date_acquired||"").localeCompare(String(a.date_acquired||"")));
  else if(s==="date_asc") r.sort((a,b)=>String(a.date_acquired||"").localeCompare(String(b.date_acquired||"")));
  else if(s==="name"){ const lab=ENT[viewKind()].label; r.sort((a,b)=>lab(a).localeCompare(lab(b))); }
  return r;
}

/* ============================ render ============================ */
function render(){
  document.querySelectorAll(".tab").forEach(t=>{
    const on=t.dataset.view===S.view;
    t.classList.toggle("active",on);
    t.setAttribute("aria-selected",on?"true":"false");
  });
  document.querySelectorAll("#bottomNav button[data-nav]").forEach(b=>{
    b.classList.toggle("on", b.dataset.nav===S.view);
  });
  $("#todayView").classList.toggle("hidden", S.view!=="today");
  $("#collectionView").classList.toggle("hidden", S.view!=="collection");
  $("#recordsView").classList.toggle("hidden", S.view!=="records");
  $("#side").classList.toggle("hidden", S.view!=="collection");
  // mobile-only: the ☰ filter-rail toggle only makes sense in Collection
  $("#menuBtn").classList.toggle("hidden", S.view!=="collection");
  if(S.view==="today"){ renderToday(); return; }
  if(S.view==="records"){ renderRecords(); return; }
  $("#wallBtn").classList.toggle("hidden", S.kind!=="ink");
  renderSide(); renderSort(); renderCards(); syncLayoutButtons();
}
// Collection now shares one layout toggle (Gallery/Compact/Table, +Wall for inks)
// across all three record kinds — S.layout is one shared, localStorage-backed value.
function effLayout(){
  if(S.kind==="ink" && S.layout==="wall") return "wall";
  return ["gallery","compact","table"].includes(S.layout) ? S.layout : "gallery";
}
function syncLayoutButtons(){
  const eff=effLayout();
  document.querySelectorAll("#layoutSeg button[data-layout]").forEach(b=>{
    const on=b.dataset.layout===eff;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
}
window.setLayout=(v)=>{
  S.layout=v; localStorage.setItem("pi_layout",S.layout);
  syncLayoutButtons(); renderCards();
};
function renderSort(){
  const sel=$("#sort");
  const opts = (S.kind==="ink" || S.kind==="paper")
    ? [["","Sort: Newest added"],["name","Name A–Z"]]
    : [["","Sort: Newest added"],["name","Name A–Z"],["paid_desc","Paid ↓"],["paid_asc","Paid ↑"],["date_desc","Acquired ↓"],["date_asc","Acquired ↑"]];
  sel.innerHTML=opts.map(o=>`<option value="${o[0]}" ${S.sort===o[0]?"selected":""}>${o[1]}</option>`).join("");
}
function uniq(arr){return [...new Set(arr.filter(Boolean))].sort();}
const FACET_CHIP_LIMIT=6;
function kindFacetHTML(){
  const n={all:S.pens.length+S.inks.length+S.papers.length, pen:S.pens.length, ink:S.inks.length, paper:S.papers.length};
  const opts=[["all","All"],["pen","Pens"],["ink","Inks"]];
  if(S.papers.length>0) opts.push(["paper","Papers"]);
  return `<div class="fgroup"><h4>Kind</h4>`+opts.map(([k,lab])=>
    `<button class="chip ${S.kind===k?"on":""}" aria-pressed="${S.kind===k?"true":"false"}" onclick="setKind('${k}')">${lab} <small>${n[k]}</small></button>`
  ).join("")+`</div>`;
}
window.setKind=(k)=>{ S.kind=k; S.filters={}; S.filterOpen={}; S.sort=""; render(); };
function renderSide(){
  const f=S.filters; const side=$("#side"); let h=kindFacetHTML();
  const grp=(title,key,items,fmt)=>{
    const open = !!S.filterOpen[key];
    const shown = (open || items.length<=FACET_CHIP_LIMIT) ? items : items.slice(0,FACET_CHIP_LIMIT);
    const hiddenN = items.length - shown.length;
    h+=`<div class="fgroup"><h4>${title}</h4>`;
    shown.forEach(it=>{
      const val=it.val, lab=fmt?fmt(it):it.val;
      const on = !!(f[key] && f[key].has(val));
      h+=`<button class="chip ${on?"on":""}" aria-pressed="${on?"true":"false"}" onclick="toggleFilter('${key}','${esc(val)}')">${esc(lab)} <small>${it.n}</small></button>`;
    });
    if(hiddenN>0){
      h+=`<button class="chip more" aria-expanded="false" onclick="toggleGroupOpen('${key}')">+${hiddenN} more</button>`;
    }else if(open && items.length>FACET_CHIP_LIMIT){
      h+=`<button class="chip more" aria-expanded="true" onclick="toggleGroupOpen('${key}')">Show less</button>`;
    }
    h+=`</div>`;
  };
  const counts=(arr,key,transform)=>{
    const m={};arr.forEach(o=>{let v=transform?transform(o[key]):o[key];if(v==null||v==="")return;v=String(v);m[v]=(m[v]||0)+1;});
    return Object.keys(m).sort().map(k=>({val:k,n:m[k]}));
  };
  if(S.kind==="pen"){
    grp("Status","status",counts(S.pens,"status"));
    const nInked=S.pens.filter(hasInk).length;
    grp("Ink status","inked",[{val:"yes",n:nInked},{val:"no",n:S.pens.length-nInked}],
        it=>it.val==="yes"?"💧 Inked":"Clean");
    grp("Make","make",counts(S.pens,"make"));
    grp("Nib material","nib_material",counts(S.pens,"nib_material"));
    grp("Fits hand","fits_hand",counts(S.pens,"fits_hand"));
  }else if(S.kind==="paper"){
    grp("Type","type",counts(S.papers,"type"));
    grp("Ruling","ruling",counts(S.papers,"ruling"));
    grp("Brand","brand",counts(S.papers,"brand"));
    grp("Rating","rating",counts(S.papers,"rating"),it=>"★".repeat(+it.val||0)||it.val);
    grp("Status","status",counts(S.papers,"status"));
  }else if(S.kind==="ink"){
    grp("Color","color_match",counts(S.inks,"color_match"));
    grp("Sheen","sheen",counts(S.inks,"sheen"));
    grp("Shimmer","shimmer",counts(S.inks,"shimmer",v=>v?"true":"false"),it=>it.val==="true"?"Shimmer":"No shimmer");
    grp("Alkaline","alkaline",counts(S.inks,"alkaline"),it=>it.val==="Yes"?"⚠ Alkaline":"Not alkaline");
    grp("Type","type",counts(S.inks,"type"));
    grp("Status","status",counts(S.inks,"status"));
  }else{
    // Kind = All — one combined Status facet and one combined Maker/Brand facet.
    const allRecs=[...S.pens,...S.inks.map(i=>({...i,status:i.status})),...S.papers];
    grp("Status","status",counts(allRecs,"status"));
    const makers=[...S.pens.map(p=>p.make),...S.inks.map(i=>i.brand),...S.papers.map(p=>p.brand)];
    const mc={};makers.forEach(m=>{if(m)mc[m]=(mc[m]||0)+1;});
    grp("Maker","make",Object.keys(mc).sort().map(k=>({val:k,n:mc[k]})));
  }
  const activeCount=Object.values(f).reduce((a,s)=>a+(s?s.size:0),0);
  if(activeCount) h=`<button class="btn ghost" style="width:100%;margin-bottom:14px" onclick="clearFilters()">Clear filters (${activeCount})</button>`+h;
  side.innerHTML=h||`<div class="empty">No filters yet</div>`;
}
window.toggleFilter=(k,v)=>{
  if(!S.filters[k]) S.filters[k]=new Set();
  if(S.filters[k].has(v)) S.filters[k].delete(v); else S.filters[k].add(v);
  if(!S.filters[k].size) delete S.filters[k];
  render();
};
window.toggleGroupOpen=(k)=>{ S.filterOpen[k]=!S.filterOpen[k]; renderSide(); };
window.clearFilters=()=>{ S.filters={}; S.filterOpen={}; render(); };

function renderCards(){
  const list=activeList();
  const noun = S.kind==="ink"?"ink":S.kind==="paper"?"paper":S.kind==="pen"?"pen":"item";
  $("#count").textContent = `${list.length} ${noun}${list.length===1?"":"s"}`+
    (Object.keys(S.filters).length?" (filtered)":"");
  const eff = effLayout();
  const box=$("#cards"); box.className=eff;
  if(!list.length){
    box.innerHTML = (S.pens.length+S.inks.length+S.papers.length===0)
      ? emptyCollectionHTML()
      : `<div class="empty">Nothing here yet. Click <b>+ Add</b> to start.</div>`;
    return;
  }
  if(S.kind==="ink"&&eff==="wall"){ box.innerHTML=renderWall(list); return; }
  if(eff==="table"){ box.innerHTML=collectionTable(list); return; }
  if(S.kind==="pen"){ box.innerHTML = eff==="compact" ? compactPens(list) : galleryPens(list); return; }
  if(S.kind==="ink"){ box.innerHTML = list.map(inkCard).join(""); return; }
  if(S.kind==="paper"){ box.innerHTML = list.map(paperCard).join(""); return; }
  // Kind = All — mixed pen/ink/paper cards in one gallery/compact grid.
  box.innerHTML = eff==="compact"
    ? list.map(({kind,rec})=>kind==="pen"?compactPens([rec]):mixedCompactCard(kind,rec)).join("")
    : list.map(({kind,rec})=>kind==="pen"?galleryPens([rec],true):mixedGalleryCard(kind,rec)).join("");
}
function emptyCollectionHTML(){
  return `<div class="empty" style="padding:70px 20px">
    <div style="font-size:15px;color:var(--txt);font-weight:600;margin-bottom:8px">Nothing in the collection yet</div>
    <div style="max-width:44ch;margin:0 auto 18px">Add your first pen, or bring in a spreadsheet you already keep.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn" onclick="document.getElementById('addBtn').click()">+ Add a pen</button>
      <button class="btn sec" onclick="openData()">⇄ Import a spreadsheet</button>
    </div></div>`;
}
function mixedGalleryCard(kind,rec){
  if(kind==="ink") return inkCard(rec).replace('class="card"','class="card" style="position:relative"').replace('<div class="ph">',`<div class="ph"><span class="kindpill">Ink</span>`);
  return paperCard(rec).replace('class="card"','class="card" style="position:relative"').replace('<div class="ph">',`<div class="ph"><span class="kindpill">Paper</span>`);
}
function mixedCompactCard(kind,rec){
  const alt=ENT[kind].label(rec);
  const th=firstPhoto(kind,rec.id);
  const media = th ? `<img class="media" src="${esc(th)}" alt="${esc(alt)}" loading="lazy">`
    : kind==="ink" ? `<div class="media" style="background:${COLOR_HEX[rec.color_match]||'#333'};border-radius:6px"></div>`
    : `<div class="media" style="display:grid;place-items:center;font-size:20px">📄</div>`;
  return `<button class="pen" onclick="${kind==='ink'?`openInk('${rec.id}')`:`openPaper('${rec.id}')`}">
    ${media}
    <div class="mid">
      <div class="nm">${esc(alt)}</div>
      <div class="spec">${kind==="ink"?esc(rec.color_match||"—"):esc(rec.type||"—")}</div>
    </div>
    <div class="money"><div class="badge ${statusClass(rec.status)}">${esc(rec.status||"")}</div></div></button>`;
}
function renderWall(list){
  const order=c=>{const i=COLORS.indexOf(c);return i<0?99:i;};
  const l=[...list].sort((a,b)=>order(a.color_match)-order(b.color_match)
    ||String(a.brand||"").localeCompare(String(b.brand||"")));
  return l.map(i=>{
    const sw=firstPhoto("ink",i.id,"swab");
    return `<div class="wtile" onclick="openInk('${i.id}')">
      ${sw?`<img src="${esc(sw)}" alt="" loading="lazy">`:`<div class="wcolor" style="background:${COLOR_HEX[i.color_match]||'#333'}"></div>`}
      <div class="wlabel">${esc(i.brand)}<br><b>${esc(i.name)}</b>${i.shimmer?" ✦":""}</div>
    </div>`;}).join("");
}
function thumb(type,o,alt){
  const u=firstPhoto(type,o.id);  // index 0 = user's chosen default, no tag override
  if(u) return `<img src="${esc(u)}" alt="${esc(alt||"")}" loading="lazy">`;
  if(type==="ink") return `<div class="swatch" style="background:${COLOR_HEX[o.color_match]||'#333'}"></div>`;
  if(type==="paper") return `<span aria-hidden="true">📄</span>`;
  return `<span aria-hidden="true">✒</span>`;
}
function paperCard(p){
  const spec=[p.size,p.gsm?p.gsm+"gsm":"",p.ruling].filter(Boolean).join(" · ");
  const stars=p.rating?"★".repeat(+p.rating):"";
  const alt=`${esc(p.brand)} ${esc(p.name)}`;
  if(effLayout()==="compact") return `<div class="lrow" onclick="openPaper('${p.id}')">
    <div class="li">${firstPhoto("paper",p.id)?`<img class="li" src="${esc(firstPhoto("paper",p.id))}" alt="${alt}">`:""}</div>
    <div><div class="t">${esc(p.brand)}</div><div class="muted">${esc(p.name)}</div></div>
    <div class="muted">${esc(spec)}</div>
    <div class="muted">${stars}</div>
    <div class="money">${money(p.price)}</div>
    <div><span class="badge ${statusClass(p.status)}">${esc(p.status)}</span></div></div>`;
  return `<div class="card" onclick="openPaper('${p.id}')">
    <div class="ph">${thumb("paper",p,alt)}</div>
    <div class="bd">
      <div class="t">${esc(p.brand)}</div>
      <div class="s">${esc(p.name)}</div>
      <div class="s">${esc(spec)}${stars?" · "+stars:""}</div>
      <div class="row"><span class="pricetag">${money(p.price)}</span>
        <span class="badge ${statusClass(p.status)}">${esc(p.status)}</span></div>
    </div></div>`;
}
function inkCard(i){
  const dots = (i.shimmer?"✦ ":"")+(i.sheen&&i.sheen!=="None"?"~"+esc(i.sheen):"");
  const th=firstPhoto("ink",i.id);
  const alt=`${esc(i.brand)} ${esc(i.name)}`;
  if(effLayout()==="compact") return `<div class="lrow" onclick="openInk('${i.id}')">
    <div class="swatch" style="background:${COLOR_HEX[i.color_match]||'#333'}">${th?`<img class="li" src="${esc(th)}" alt="${alt}">`:""}</div>
    <div><div class="t">${esc(i.brand)}</div><div class="muted">${esc(i.name)}</div></div>
    <div class="muted">${esc(i.color_match)}</div>
    <div class="muted">${dots||"—"}</div>
    <div class="muted">${esc(i.type||"")}</div>
    <div><span class="badge ${statusClass(i.status)}">${esc(i.status)}</span></div></div>`;
  return `<div class="card" onclick="openInk('${i.id}')">
    <div class="ph">${thumb("ink",i,"Swab of "+alt)}</div>
    <div class="bd">
      <div class="t">${esc(i.brand)}</div>
      <div class="s">${esc(i.name)}</div>
      <div class="row"><span class="pricetag">${esc(i.color_match||"")} ${dots}</span>
        <span class="badge ${statusClass(i.status)}">${esc(i.status)}</span></div>
    </div></div>`;
}

/* ============================ pen cards: gallery / compact ============================
   Ported from the reviewed redesign prototype. A pen without a photo yet shows a drawn
   placeholder (barrel colourway + nib metal) instead of an empty box, so the grid holds
   its shape as photos are added — the card is the same size either way. */
function shade(hex,f){const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);
  return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");}
function nibGrad(m){
  const s=(m||"").toLowerCase();
  if(s.includes("21k"))return"g21"; if(s.includes("18k"))return"g18";
  if(s.includes("14k")||s.includes("gold"))return"g14";
  if(s.includes("steel"))return"gst"; return"gun";
}
const MATCOL=[[/pearl|ivory|cream|white/i,"#D9D4C6"],[/blue.*marble|marble.*blue/i,"#3E5F91"],
 [/oxblood|burgundy|maroon/i,"#7C2B2E"],[/tortoise|amber|honey/i,"#9A6520"],[/olive|wood/i,"#6E5C2F"],
 [/green|jade/i,"#2E6B4A"],[/red/i,"#8A2E2E"],[/blue/i,"#33578C"],[/purple|violet|plum/i,"#5B3E82"],
 [/orange/i,"#B5601F"],[/brown|cocoa/i,"#6E4622"],[/silver|chrome|steel|grey|gray/i,"#8892A0"],
 [/black|ebonite/i,"#232830"]];
const matColor=t=>{for(const[re,c]of MATCOL)if(re.test(t||""))return c;return"#4A5460";};
function penSil(p){
  const c=matColor(p.material_color), g=nibGrad(p.nib_material);
  return `<svg class="sil" viewBox="0 0 200 46" aria-hidden="true">
    <rect x="4" y="12" width="118" height="22" rx="11" fill="${c}"/>
    <rect x="4" y="12" width="46" height="22" rx="11" fill="${shade(c,1.18)}"/>
    <rect x="47" y="12" width="5" height="22" fill="url(#${g})" opacity=".9"/>
    <path d="M122 14h14c5 0 8 3 8 9s-3 9-8 9h-14z" fill="${shade(c,.72)}"/>
    <path d="M143 16.4l24 4.7v3.8l-24 4.7z" fill="url(#${g})" stroke="rgba(0,0,0,.34)" stroke-width=".7"/>
    <path d="M148.5 23h15" stroke="rgba(0,0,0,.42)" stroke-width="1"/>
    <circle cx="150" cy="23" r="1.5" fill="rgba(0,0,0,.42)"/>
  </svg>`;
}
function nibSVG(p){
  const g=nibGrad(p.nib_material);
  const stamp=(p.nib_grind||"").split(/\s+/)[0].slice(0,4).toUpperCase();
  return `<svg class="nib" viewBox="0 0 40 64" aria-hidden="true">
    <path d="M20 1.5c9.4 0 16.5 7 16.5 17v7.6c0 14.4-8.4 28.4-16.5 36.4C11.9 54.5 3.5 40.5 3.5 26.1V18.5c0-10 7.1-17 16.5-17z"
      fill="url(#${g})" stroke="rgba(0,0,0,.42)" stroke-width="1"/>
    <circle cx="20" cy="27" r="3.6" fill="var(--bg)"/>
    <path d="M20 30.6V60" stroke="var(--bg)" stroke-width="1.7" stroke-linecap="round"/>
    <text x="20" y="16.5" text-anchor="middle" font-family="sans-serif" font-size="8.5"
      font-weight="700" letter-spacing=".6" fill="rgba(0,0,0,.55)">${esc(stamp)}</text>
  </svg>`;
}
// est_value ("Asking reference") is provenance, not a valuation — it's shown only
// when a pen is actually headed for sale (Will Sell / Listed), never as a running
// gain/loss figure. See framing rule in the build brief.
const forSale = p => p.status==="Will Sell" || p.status==="Listed";
function acqShort(p){
  if(!p.date_acquired) return "";
  const d=new Date(p.date_acquired); if(isNaN(d)) return "";
  return d.toLocaleDateString(undefined,{month:"short",year:"numeric"});
}
function galleryPens(list,pill){
  return list.map(p=>{
    const photos=photosFor("pen",p.id), src=photos.length?photoUrl(photos[0]):null;
    const showPill=p.status && p.status!=="Keep";
    const alt=`${esc(p.make)} ${esc(p.model)}`;
    const media = src
      ? `<img src="${esc(src)}" alt="${alt}${p.material_color?", "+esc(p.material_color):""}" loading="lazy">`
        + (photos.length>1?`<span class="cnt">${photos.length} photos</span>`:"")
      : `${penSil(p)}<span class="pend">Photo pending</span>`;
    const badge = showPill?`<span class="badge ${statusClass(p.status)}">${esc(p.status)}</span>`:"";
    const acq=acqShort(p);
    return `<button class="gcard" onclick="openPen('${p.id}')">
      <div class="media">${pill?'<span class="kindpill">Pen</span>':''}${media}${badge}</div>
      <div class="gb">
        <div class="nm">${esc(p.make)} ${esc(p.model)}${hasInk(p)?" 💧":""}</div>
        <div class="mat"><span class="matdot" style="background:${matColor(p.material_color)}"></span><span>${esc(p.material_color||"—")}</span></div>
        <div class="spec">${esc(p.nib_grind||"—")}${p.nib_material?" · "+esc(p.nib_material):""}</div>
        <div class="foot">

}

/* ── Table layout (Collection): one dense sortable table across kinds ── */
S.tblSort=S.tblSort||{col:"name",dir:1};
function collectionTable(list){
  const rows = list.map(x=>x.kind ? x : {kind:S.kind,rec:x});
  const colDefs=[["name","Name"],["material","Material"],["nib","Nib"],["acquired","Acquired"],["paid","Paid"],["status","Status"]];
  const val=(kind,rec,col)=>{
    if(col==="name") return ENT[kind].label(rec);
    if(col==="material") return kind==="pen"?rec.material_color:kind==="ink"?rec.color_match:rec.type;
    if(col==="nib") return kind==="pen"?[rec.nib_grind,rec.nib_material].filter(Boolean).join(" · "):"—";
    if(col==="acquired") return kind==="pen"?(rec.date_acquired||""):(rec.added_at||"").slice(0,10);
    if(col==="paid") return kind==="pen"?rec.paid:(kind==="paper"?rec.price:null);
    if(col==="status") return rec.status||"";
  };
  const {col,dir}=S.tblSort;
  rows.sort((a,b)=>{
    let av=val(a.kind,a.rec,col), bv=val(b.kind,b.rec,col);
    if(col==="paid"){av=av==null?-Infinity:Number(av);bv=bv==null?-Infinity:Number(bv);return (av-bv)*dir;}
    return String(av||"").localeCompare(String(bv||""))*dir;
  });
  const openFn=(kind,id)=>kind==="pen"?`openPen('${id}')`:kind==="ink"?`openInk('${id}')`:`openPaper('${id}')`;
  return `<div style="overflow:auto"><table class="coltbl"><thead><tr>
    ${colDefs.map(([c,lab])=>`<th onclick="tblSortBy('${c}')">${lab}${col===c?(dir>0?" ▲":" ▼"):""}</th>`).join("")}
    </tr></thead><tbody>
    ${rows.map(({kind,rec})=>`<tr onclick="${openFn(kind,rec.id)}">
      <td>${esc(val(kind,rec,"name"))}</td>
      <td>${esc(val(kind,rec,"material")||"—")}</td>
      <td>${esc(val(kind,rec,"nib"))}</td>
      <td>${esc(val(kind,rec,"acquired")||"—")}</td>
      <td class="num">${money(val(kind,rec,"paid"))}</td>
      <td><span class="badge ${statusClass(rec.status)}">${esc(rec.status||"")}</span></td>
    </tr>`).join("")}
    </tbody></table></div>`;
}
window.tblSortBy=(col)=>{
  if(S.tblSort.col===col) S.tblSort.dir*=-1; else S.tblSort={col,dir:1};
  renderCards();
};

const NUMWORD=["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
const nw=n=>n<=10?NUMWORD[n]:String(n);
function fmtDate(s){ if(!s)return""; const d=new Date(s); return isNaN(d)?String(s):d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function renderToday(){
  const box=$("#todayView");
  const pens=S.pens, inks=S.inks;
  if(!pens.length && !inks.length && !S.papers.length){
    box.innerHTML=`<div class="empty-today" style="grid-column:1/-1">
      <div class="headline">Nothing in the collection yet.</div>
      <div class="subline" style="margin:10px auto 18px">Add your first pen, or bring in a spreadsheet you already keep — the rest of this page fills in once there's something to track.</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn" onclick="document.getElementById('addBtn').click()">+ Add a pen</button>
        <button class="btn sec" onclick="openData()">⇄ Import a spreadsheet</button>
      </div></div>`;
    return;
  }
  const inCabinet=pens.filter(p=>p.status!=="Sold");
  const inkedPens=inCabinet.filter(hasInk);
  const liveInks=inks.filter(i=>i.status!=="Dispose");
  // Score every clean, kept pen against every live ink with the same local
  // pairing engine used on the pen/ink detail sheets — no separate logic.
  const combos=[];
  inCabinet.filter(p=>p.status==="Keep"&&!hasInk(p)).forEach(pen=>{
    liveInks.forEach(ink=>{ const r=scoreInkForPen(pen,ink); combos.push({pen,ink,score:r.s,why:r.why,warn:r.warn}); });
  });
  combos.sort((a,b)=>b.score-a.score);
  const seenPen=new Set(); const ready=[];
  for(const c of combos){ if(c.score<1) break; if(seenPen.has(c.pen.id)) continue; seenPen.add(c.pen.id); ready.push(c); if(ready.length>=3) break; }
  const steer=combos.filter(c=>c.score<=-2).sort((a,b)=>a.score-b.score)[0];

  const dow=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  let headline,subline;
  if(!inkedPens.length){
    headline="Nothing is inked.";
    subline=`${nw(inCabinet.length)} pen${inCabinet.length===1?"":"s"}, all of them clean and empty.`+
      (ready.length?` ${nw(ready.length)} pairing${ready.length===1?"":"s"} below ${ready.length===1?"is":"are"} drawn from what is actually in the cabinet.`:"");
  }else{
    headline=inkedPens.length===1?"One pen is inked.":`${nw(inkedPens.length)} pens are inked.`;
    const rest=inCabinet.length-inkedPens.length;
    subline=rest>0?`${nw(rest)} more sit clean in the cabinet.`:"Every pen in the cabinet is holding ink.";
  }
  const daysInked=p=>{if(!p.inked_date)return null;const d=Math.floor((Date.now()-new Date(p.inked_date))/86400000);return isNaN(d)?null:d;};
  const inkedListHTML=inkedPens.length?`<div class="inked-list">${inkedPens.map(p=>{
    const d=daysInked(p);
    return `<div class="inked-row">
      <div style="min-width:0;flex:1"><div class="nm">${esc(p.make)} ${esc(p.model)}</div>
        <div class="ink">${esc(p.inked_with||"")}</div></div>
      <span class="days">${d!=null?d+"d":""}</span>
      <button class="btn ghost" style="min-height:auto;padding:7px 12px;font-size:12.5px" onclick="markPenCleaned('${p.id}')">🧼 Mark cleaned</button>
    </div>`;}).join("")}</div>`:"";

  const pairingHTML=c=>`<div class="pairing">
      ${penSil(c.pen)}
      <span class="swatch" style="background:${COLOR_HEX[c.ink.color_match]||'#333'}"></span>
      <div class="txt"><b>${esc(ENT.pen.label(c.pen))} + ${esc(ENT.ink.label(c.ink))}</b>
        <div class="why">${esc(c.why[0]||"")}</div></div>
      <button class="go" onclick="inkThisPairing('${c.pen.id}','${c.ink.id}')">Ink this</button>
    </div>`;
  const steerHTML=c=>`<div class="steerclear">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-linecap="round" style="width:18px;height:18px;flex:none;margin-top:1px"><path d="M12 8.5v5"/><circle cx="12" cy="16.6" r=".9" fill="var(--bad)" stroke="none"/><path d="M10.3 3.9 2.6 17.4a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linejoin="round"/></svg>
      <div><b>Steer clear — ${esc(ENT.ink.label(c.ink))} in the ${esc(ENT.pen.label(c.pen))}</b>
        <div class="why">${esc(c.warn[0]||"")}</div></div></div>`;

  const left=`
    <div>
      <div class="eyebrow">${esc(dow)}</div>
      <div class="headline">${esc(headline)}</div>
      <div class="subline">${esc(subline)}</div>
      ${inkedListHTML}
    </div>
    ${ready.length?`<div>
      <div class="sec-head"><span class="eyebrow">Ready to ink</span><span class="line"></span></div>
      ${ready.map(pairingHTML).join("")}
    </div>`:(inCabinet.length&&liveInks.length?"":`<div class="subline">Add a pen and an ink to see pairings here.</div>`)}
    ${steer?steerHTML(steer):""}
  `;

  const nInk=liveInks.length;
  const makers=uniq(inCabinet.map(p=>p.make)).length;
  const flexN=inCabinet.filter(p=>/flex/i.test(p.nib_grind||"")).length;
  const willSell=pens.filter(p=>p.status==="Will Sell").length;
  const noRef=inCabinet.filter(p=>p.est_value==null||p.est_value==="").length;
  const noPhoto=pens.filter(p=>!photosFor("pen",p.id).length).length;
  const photographed=pens.length-noPhoto;
  const pct=pens.length?Math.round(photographed/pens.length*100):0;
  const inksNoPhoto=inks.filter(i=>!photosFor("ink",i.id).length).length;
  const inkPhotoNote=inks.length?(inksNoPhoto===0?"inks are done":`${inks.length-inksNoPhoto} of ${inks.length} inks photographed`):"";

  const allAdded=[...pens.map(p=>({kind:"pen",rec:p})),...inks.map(i=>({kind:"ink",rec:i})),...S.papers.map(p=>({kind:"paper",rec:p}))]
    .filter(x=>x.rec.added_at).sort((a,b)=>String(b.rec.added_at).localeCompare(String(a.rec.added_at)));
  const last=allAdded[0];
  let lastHTML="";
  if(last){
    const r=last.rec,when=(r.added_at||"").slice(0,10);
    let sub="",chip="";
    if(last.kind==="pen"){ sub=[when&&fmtDate(when),r.source,r.paid!=null?money(r.paid):""].filter(Boolean).join(" · ");
      chip=[r.nib_grind,r.nib_material].filter(Boolean).join(" · "); }
    else if(last.kind==="ink"){ sub=[when&&fmtDate(when),r.color_match].filter(Boolean).join(" · ");
      chip=r.sheen&&r.sheen!=="None"?r.sheen+" sheen":(r.shimmer?"Shimmer":""); }
    else { sub=[when&&fmtDate(when),r.type].filter(Boolean).join(" · "); }
    lastHTML=`<div class="rail-panel"><div class="eyebrow">Last added</div>
      <div style="font-family:var(--serif);font-size:14.5px;font-weight:700;margin-top:11px">${esc(ENT[last.kind].label(r))}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(sub)}</div>
      ${chip?`<div style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-top:8px">${esc(chip)}</div>`:""}
      </div>`;
  }

  const right=`
    <div class="rail-panel">
      <div class="eyebrow">In the cabinet</div>
      <div style="margin-top:13px">
        <div class="rail-row"><span>Pens</span><b>${inCabinet.length}</b></div>
        <div class="rail-row" style="margin-top:11px"><span>Inks</span><b>${nInk}</b></div>
        <div class="rail-row" style="margin-top:11px"><span>Makers</span><b>${makers}</b></div>
        <div class="rail-hr"></div>
        <div class="rail-row"><span>Flex or semi-flex nibs</span><b>${flexN}</b></div>
      </div>
    </div>
    <div class="rail-panel">
      <div class="eyebrow">Worth doing</div>
      <div style="margin-top:13px;display:flex;flex-direction:column;gap:10px">
        <div class="rail-todo"><span class="n" style="color:var(--bad)">${willSell}</span><span>marked <b style="color:var(--bad)">Will Sell</b> but not listed yet</span></div>
        <div class="rail-hr" style="margin:0"></div>
        <div class="rail-todo"><span class="n">${noRef}</span><span>pen${noRef===1?"":"s"} have no asking reference</span></div>
        <div class="rail-hr" style="margin:0"></div>
        <div class="rail-todo"><span class="n">${noPhoto}</span><span>still to photograph</span></div>
        <div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-lab">${photographed} of ${pens.length} photographed${inkPhotoNote?" · "+esc(inkPhotoNote):""}</div>
        </div>
      </div>
    </div>
    ${lastHTML}
  `;
  box.innerHTML=`<div>${left}</div><div>${right}</div>`;
}
window.markPenCleaned=async(id)=>{
  const p=S.pens.find(x=>x.id===id); if(!p)return;
  p.inked_with=""; p.inked_date=""; p.last_cleaned=new Date().toISOString().slice(0,10);
  await savePens(); render(); toast("Marked cleaned",true);
};
window.inkThisPairing=async(penId,inkId)=>{
  const p=S.pens.find(x=>x.id===penId), i=S.inks.find(x=>x.id===inkId);
  if(!p||!i)return;
  p.inked_with=ENT.ink.label(i); p.inked_date=new Date().toISOString().slice(0,10);
  await savePens(); render(); toast(`Inked with ${ENT.ink.label(i)}`,true);
};
window.startPhotoRun=()=>{
  const openers={pen:"openPen",ink:"openInk",paper:"openPaper"};
  const kindLabel={pen:"Pens",ink:"Inks",paper:"Papers"};
  const groups=["pen","ink","paper"].map(kind=>({
    kind, items:ENT[kind].list().filter(r=>!photosFor(kind,r.id).length)

    if(c==="pen") return ENT.pen.label(p);

    if(c==="paid") return p.paid==null?-Infinity:Number(p.paid);
    if(c==="from") return [p.source,p.seller].filter(Boolean).join(" · ");
    if(c==="ref") return p.est_value==null?-Infinity:Number(p.est_value);

  rows=rows.sort((a,b)=>{const av=val(a,col),bv=val(b,col);

/* ---------- photo editor: crop + rotate (canvas, no libs) ---------- */
let PE=null;
window.openPhotoEditor=(type,id,url)=>{
  modal(`<div class="sheet" style="max-width:760px"><div class="head"><h2>✂️ Edit photo</h2>
    <button class="x" aria-label="Close" onclick="peClose()">✕</button></div>
    <div class="body">
      <canvas id="pe-canvas"></canvas>
      <div class="pe-tools">
        <button class="btn sec" onclick="peRotate(-90)">↺ Rotate left</button>
        <button class="btn sec" onclick="peRotate(90)">↻ Rotate right</button>
        <button class="btn ghost" onclick="peReset()">Reset</button>
      </div>
      <p class="muted" style="text-align:center;font-size:13px;margin:10px 0 0">
        Drag on the photo to crop. Saving replaces this photo.</p>
    </div>
    <div class="foot">
      <button class="btn sec" onclick="peClose()">Cancel</button>
      <button class="btn" id="pe-save" onclick="peSave()">Save</button>
    </div></div>`);
  PE={type,id,url,rot:0,img:new Image(),crop:null,drag:null};
  PE.img.onload=()=>peDraw();
  PE.img.src=url;
  const cv=$("#pe-canvas");
  cv.addEventListener("pointerdown",peDown);
  cv.addEventListener("pointermove",peMove);
  cv.addEventListener("pointerup",peUp);
  cv.addEventListener("pointercancel",peUp);
};
function peDims(){ // canvas size = rotated image, capped so huge phone shots stay snappy
  const max=3200;
  let w=PE.img.naturalWidth||1,h=PE.img.naturalHeight||1;
  const sc=Math.min(1,max/Math.max(w,h));
  w=Math.round(w*sc);h=Math.round(h*sc);
  return (PE.rot%180===0)?{w,h}:{w:h,h:w};
}
function peDrawBase(ctx,w,h){
  ctx.save();
  ctx.translate(w/2,h/2);ctx.rotate(PE.rot*Math.PI/180);
  const iw=(PE.rot%180===0)?w:h, ih=(PE.rot%180===0)?h:w;
  ctx.drawImage(PE.img,-iw/2,-ih/2,iw,ih);
  ctx.restore();
}
function peDraw(){
  const cv=$("#pe-canvas");if(!cv||!PE)return;
  const {w,h}=peDims();
  cv.width=w;cv.height=h;
  const ctx=cv.getContext("2d");
  peDrawBase(ctx,w,h);
  if(PE.crop){
    const c=PE.crop;
    ctx.fillStyle="rgba(0,0,0,.55)";
    ctx.beginPath();ctx.rect(0,0,w,h);ctx.rect(c.x,c.y,c.w,c.h);ctx.fill("evenodd");
    ctx.strokeStyle="#fff";ctx.setLineDash([7,5]);ctx.lineWidth=Math.max(2,w/400);
    ctx.strokeRect(c.x,c.y,c.w,c.h);ctx.setLineDash([]);
  }
}
function pePos(ev){
  const cv=$("#pe-canvas"),r=cv.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*cv.width/r.width,
          y:(ev.clientY-r.top)*cv.height/r.height};
}
function peDown(ev){
  ev.preventDefault();
  $("#pe-canvas").setPointerCapture(ev.pointerId);
  PE.drag=pePos(ev);PE.crop=null;peDraw();
}
function peMove(ev){
  if(!PE||!PE.drag)return;
  const cv=$("#pe-canvas");
  const p=pePos(ev),d=PE.drag;
  const clamp=(v,max)=>Math.max(0,Math.min(v,max));
  const x1=clamp(Math.min(d.x,p.x),cv.width), y1=clamp(Math.min(d.y,p.y),cv.height);
  const x2=clamp(Math.max(d.x,p.x),cv.width), y2=clamp(Math.max(d.y,p.y),cv.height);
  PE.crop={x:x1,y:y1,w:x2-x1,h:y2-y1};
  peDraw();
}
function peUp(){
  if(!PE)return;
  PE.drag=null;
  if(PE.crop&&(PE.crop.w<20||PE.crop.h<20))PE.crop=null; // ignore accidental taps
  peDraw();
}
window.peRotate=d=>{if(!PE)return;PE.rot=(PE.rot+d+360)%360;PE.crop=null;peDraw();};
window.peReset=()=>{if(!PE)return;PE.rot=0;PE.crop=null;peDraw();};
window.peClose=()=>{
  const ctx=PE;PE=null;closeModal();
  if(ctx)({pen:openPen,ink:openInk,paper:openPaper})[ctx.type](ctx.id);
};
window.peSave=async()=>{
  if(!PE)return;
  const btn=$("#pe-save");btn.disabled=true;btn.innerHTML='<span class="spin"></span>Saving…';
  const {w,h}=peDims();
  const c=PE.crop||{x:0,y:0,w,h};
  // clean rotated base (no overlay), then cut the crop from it
  const base=document.createElement("canvas");base.width=w;base.height=h;
  peDrawBase(base.getContext("2d"),w,h);
  const out=document.createElement("canvas");
  out.width=Math.max(1,Math.round(c.w));out.height=Math.max(1,Math.round(c.h));
  out.getContext("2d").drawImage(base,c.x,c.y,c.w,c.h,0,0,out.width,out.height);
  const dataUrl=out.toDataURL("image/jpeg",0.92);
  try{
    const r=await fetch("/api/replace-photo",{method:"POST",headers:apiHeaders(),
      body:JSON.stringify({key:PE.type+":"+PE.id,url:PE.url,data:dataUrl.split(",")[1]})});
    const j=await r.json();
    if(!j.ok){toast(j.error||"Save failed");btn.disabled=false;btn.textContent="Save";return;}
    await refreshPhotos();
    toast("Photo updated",true);
    peClose();
    render();
  }catch(e){toast("Save failed");btn.disabled=false;btn.textContent="Save";}
};
